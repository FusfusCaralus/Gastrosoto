/* ---- Heurísticas sencillas para distinguir carne blanca/roja y pescado blanco/azul,
   por si la receta no lo indica explícitamente en meatType/fishType. ---- */
const WHITE_MEAT_WORDS = ['pollo','pavo','conejo','pechuga'];
const RED_MEAT_WORDS = ['ternera','cerdo','cordero','vacuno','buey','solomillo','chuleta'];
function classifyMeat(rec){
  if(rec.meatType==='blanca' || rec.meatType==='roja') return rec.meatType;
  const text = ((rec.mainIngredientDetail||'')+' '+(rec.name||'')).toLowerCase();
  if(RED_MEAT_WORDS.some(w=>text.includes(w))) return 'roja';
  if(WHITE_MEAT_WORDS.some(w=>text.includes(w))) return 'blanca';
  return '';
}
const WHITE_FISH_WORDS = ['merluza','dorada','lubina','bacalao','rape'];
const OILY_FISH_WORDS = ['caballa','salmón','salmon','sardina','atún','atun','boquerón','boqueron'];
function classifyFish(rec){
  if(rec.fishType==='blanco' || rec.fishType==='azul') return rec.fishType;
  const text = ((rec.mainIngredientDetail||'')+' '+(rec.name||'')).toLowerCase();
  if(OILY_FISH_WORDS.some(w=>text.includes(w))) return 'azul';
  if(WHITE_FISH_WORDS.some(w=>text.includes(w))) return 'blanco';
  return '';
}

/* Elige una receta entre varias candidatas. `opts` admite:
   recentIds (evitar repetir), monthNum (bonus de temporada), preferWeight
   ('ligero'|'contundente', preferencia blanda), history + category (para
   penalizar suavemente repetir el mismo ingrediente principal). */
function pickRecipe(candidates, opts){
  if(!candidates || !candidates.length) return null;
  opts = opts || {};
  const recentIds = opts.recentIds || [];
  const monthNum = opts.monthNum;
  const preferWeight = opts.preferWeight || null;
  const history = opts.history || null;
  const category = opts.category || null;
  const season = monthNum!=null ? seasonForMonth(monthNum) : null;
  const scored = candidates.map(r=>{
    let score = 0;
    if(recentIds.includes(r.id)) score += 40; // penaliza repetir en esta semana
    if(history && (history.recentRecipeIds||[]).includes(r.id)) score += 15; // repetido en semanas recientes
    if(season){
      if(r.season && r.season!=='todo_el_año' && r.season!==season) score += 12;
      if(r.season===season) score -= 6;
    }
    if(r.role==='plato_principal') score += harvardScore(r.plate)*0.3;
    if(preferWeight && r.weight){
      score += r.weight===preferWeight ? -4 : 6;
    }
    if(history && category && r.mainIngredientDetail && history.lastMainIngredientByCategory &&
       history.lastMainIngredientByCategory[category] &&
       r.mainIngredientDetail.toLowerCase()===String(history.lastMainIngredientByCategory[category]).toLowerCase()){
      score += 18; // procura no repetir el mismo ingrediente principal semana tras semana
    }
    if(history && category && r.cookStyle && history.lastCookStyleByCategory &&
       history.lastCookStyleByCategory[category] &&
       r.cookStyle === history.lastCookStyleByCategory[category]){
      score += 10; // y tampoco repetir el mismo estilo de cocción, aunque cambie el ingrediente
    }
    if(opts.preferProteinBearing){
      score += PROTEIN_BEARING_CATEGORIES.includes(r.foodType) ? -5 : 5;
    }
    score += Math.random()*8; // variedad
    return {r, score};
  }).sort((a,b)=>a.score-b.score);
  return scored[0].r;
}

const COMIDA_WEEK_BUCKET = ['legumbre','cereal','verdura','verdura','carne','pescado','proteina_vegetal'];
/* Categorías que aportan proteína (para dar preferencia blanda a la cena
   por encima de platos que son solo verdura/fruta/cereal). */
const PROTEIN_BEARING_CATEGORIES = ['carne','pescado','marisco','legumbre','proteina_vegetal','huevo','lacteo'];
function shuffledCategoryOrder(){
  const arr = COMIDA_WEEK_BUCKET.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* Genera un plan para un conjunto de fechas (una semana o un mes, como
   cadena de semanas ISO lunes-domingo). La comida (slot "comida") sigue
   reglas de variedad y equilibrio nutricional más estrictas; el resto de
   comidas usa una lógica más simple. Devuelve {days, skippedBuckets}. */
async function generatePlan(dates, monthNum){
  const skippedBuckets = [];
  const dinersMap = await computeDinersForRange(dates);
  let history = await loadPlanningHistory();
  const dessertCandidates = state.recipes.filter(r=>r.role==='postre');
  let recentDesserts = [];
  const doComida = state.mealSlots.includes('comida');
  const otherSlots = state.mealSlots.filter(s=>s!=='comida');

  // Agrupar las fechas en semanas ISO (lunes-domingo), en orden.
  const weekOrder = [];
  const weekMap = new Map();
  for(const d of dates){
    const wk = isoWeekKey(d);
    if(!weekMap.has(wk)){ weekMap.set(wk, []); weekOrder.push(wk); }
    weekMap.get(wk).push(d);
  }

  const days = [];
  for(const wk of weekOrder){
    const weekDates = weekMap.get(wk);

    // Descartar del historial las fechas de carne roja de hace más de 30 días.
    const refDate = weekDates[0];
    history.redMeatDates = (history.redMeatDates||[]).filter(dt=>{
      const diff = (new Date(refDate+'T00:00:00') - new Date(dt+'T00:00:00')) / (24*3600*1000);
      return diff <= 30;
    });

    const categoryOrder = doComida ? shuffledCategoryOrder() : [];
    const usedComidaIds = [];
    const usedOtherIds = {};
    let pescadoTypesThisWeek = [];

    for(let i=0;i<weekDates.length;i++){
      const date = weekDates[i];
      const monthOfDate = monthNum!=null ? monthNum : (new Date(date+'T00:00:00').getMonth()+1);
      const meals = {};
      const dayUsedIds = [];
      let comidaCategoryForDay = null;

      if(doComida){
        const category = categoryOrder[i];
        let candidates = state.recipes.filter(r=>(r.mealTypes||[]).includes('comida') && r.foodType===category && !usedComidaIds.includes(r.id));

        if(!candidates.length){
          // Sin recetas variadas de esa categoría esta semana: buscamos cualquier
          // comida no repetida, y si tampoco hay, permitimos repetir como último recurso.
          candidates = state.recipes.filter(r=>(r.mealTypes||[]).includes('comida') && !usedComidaIds.includes(r.id));
          if(!candidates.length) candidates = state.recipes.filter(r=>(r.mealTypes||[]).includes('comida'));
          if(candidates.length){
            const catLabel = (FOOD_TYPES.find(f=>f.id===category)||{}).label || category;
            skippedBuckets.push(`No había suficientes recetas de ${catLabel.toLowerCase()} variadas esta semana, así que se ha completado el menú con otra opción.`);
          }
        }

        // Límite de carne roja: máximo ~2 veces en los últimos 30 días.
        if(category==='carne' && candidates.length){
          const redCount = (history.redMeatDates||[]).length;
          if(redCount>=2){
            const whiteOnly = candidates.filter(r=> classifyMeat(r)!=='roja');
            if(whiteOnly.length) candidates = whiteOnly;
            else console.warn('No hay recetas de carne blanca disponibles; se permite carne roja pese al límite mensual de 2 veces cada 30 días.');
          }
        }

        // Variar entre pescado blanco y azul en las dos comidas de pescado de la semana.
        if(category==='pescado' && candidates.length>1 && pescadoTypesThisWeek.length){
          const lastType = pescadoTypesThisWeek[pescadoTypesThisWeek.length-1];
          if(lastType){
            const opposite = candidates.filter(r=> classifyFish(r) && classifyFish(r)!==lastType);
            if(opposite.length) candidates = opposite;
          }
        }

        const chosen = candidates.length ? pickRecipe(candidates, {
          recentIds: usedComidaIds, monthNum: monthOfDate, preferWeight:'contundente', history, category,
        }) : null;

        if(chosen){
          meals.comida = chosen.id;
          usedComidaIds.push(chosen.id);
          dayUsedIds.push(chosen.id);
          comidaCategoryForDay = category;
          if(chosen.mainIngredientDetail){
            history.lastMainIngredientByCategory = history.lastMainIngredientByCategory || {};
            history.lastMainIngredientByCategory[category] = chosen.mainIngredientDetail;
          }
          if(chosen.cookStyle){
            history.lastCookStyleByCategory = history.lastCookStyleByCategory || {};
            history.lastCookStyleByCategory[category] = chosen.cookStyle;
          }
          if(category==='carne' && classifyMeat(chosen)==='roja'){
            history.redMeatDates = history.redMeatDates || [];
            history.redMeatDates.push(date);
          }
          if(category==='pescado'){
            pescadoTypesThisWeek.push(classifyFish(chosen));
          }
        } else {
          meals.comida = null;
          skippedBuckets.push(`No hay ninguna receta de comida disponible para el ${fmtDateHuman(date)}.`);
        }
      }

      for(const slot of otherSlots){
        usedOtherIds[slot] = usedOtherIds[slot] || [];
        let candidates = state.recipes.filter(r=>(r.mealTypes||[]).includes(slot) && !usedOtherIds[slot].includes(r.id) && !dayUsedIds.includes(r.id));
        if(!candidates.length) candidates = state.recipes.filter(r=>(r.mealTypes||[]).includes(slot) && !dayUsedIds.includes(r.id));
        // La cena no repite, en el mismo día, el tipo de alimento de la comida
        // (si eso deja el bucle vacío, volvemos al conjunto sin filtrar antes
        // que dejar la cena sin asignar).
        if(slot==='cena' && comidaCategoryForDay){
          const filtered = candidates.filter(r=> r.foodType !== comidaCategoryForDay);
          if(filtered.length) candidates = filtered;
        }
        const chosen = pickRecipe(candidates, {
          recentIds: usedOtherIds[slot], monthNum: monthOfDate,
          preferWeight: slot==='cena' ? 'ligero' : null, history,
          preferProteinBearing: slot==='cena',
        });
        meals[slot] = chosen ? chosen.id : null;
        if(chosen){ usedOtherIds[slot].push(chosen.id); dayUsedIds.push(chosen.id); }
      }

      const chosenDessert = pickRecipe(dessertCandidates, {recentIds: recentDesserts.slice(-3), monthNum: monthOfDate});
      if(chosenDessert) recentDesserts.push(chosenDessert.id);

      days.push({date, meals, dessert: chosenDessert?chosenDessert.id:null, diners: dinersMap[date]||0, comidaCategory: comidaCategoryForDay});
    }

    // Actualizamos el historial con lo elegido en esta semana antes de pasar a la siguiente.
    const weekPicks = usedComidaIds.concat(...Object.values(usedOtherIds));
    history.recentRecipeIds = (history.recentRecipeIds||[]).concat(weekPicks).slice(-20);
    await savePlanningHistory(history);
  }

  // Regla especial de planificación mensual: un domingo con toda la familia
  // en casa se reserva, si es posible, para pollo asado, y otro domingo
  // distinto (también con todos en casa) para un arroz. Es un extra sobre
  // el ciclo normal de categorías, y sólo se aplica al generar un mes
  // (monthNum viene informado); nunca debe romper el resto del plan.
  if(monthNum!=null && doComida){
    try{
      const fullyAttendedSundays = days.filter(d=>{
        const dow = (new Date(d.date+'T00:00:00').getDay()+6)%7; // 6 = domingo
        return dow===6 && state.family.length>0 && d.diners===state.family.length;
      });
      if(fullyAttendedSundays.length){
        const polloIdx = Math.floor(Math.random()*fullyAttendedSundays.length);
        const polloDay = fullyAttendedSundays[polloIdx];
        const polloCandidates = state.recipes.filter(r=>{
          if(r.foodType!=='carne') return false;
          const text = stripAccents((r.name||'')+' '+(r.mainIngredientDetail||'')).toLowerCase();
          return text.includes('pollo');
        });
        const polloAsado = polloCandidates.find(r=> stripAccents(r.name||'').toLowerCase().includes('asad'));
        const polloChosen = polloAsado || polloCandidates[0] || null;
        if(polloChosen){
          polloDay.meals.comida = polloChosen.id;
          polloDay.comidaCategory = 'carne';
          polloDay._special = 'pollo_asado';
        } else {
          skippedBuckets.push('No he podido reservar el pollo asado de domingo: no tienes ninguna receta de pollo guardada.');
        }

        const remainingSundays = fullyAttendedSundays.filter((d,i)=> i!==polloIdx);
        if(remainingSundays.length){
          const arrozDay = remainingSundays[Math.floor(Math.random()*remainingSundays.length)];
          const arrozCandidates = state.recipes.filter(r=>{
            if(r.foodType!=='cereal') return false;
            const text = stripAccents((r.name||'')+' '+(r.mainIngredientDetail||'')).toLowerCase();
            return text.includes('arroz');
          });
          if(arrozCandidates.length){
            const arrozChosen = arrozCandidates[Math.floor(Math.random()*arrozCandidates.length)];
            arrozDay.meals.comida = arrozChosen.id;
            arrozDay.comidaCategory = 'cereal';
            arrozDay._special = 'arroz';
          } else {
            skippedBuckets.push('No tienes ninguna receta de arroz para asignar al domingo especial.');
          }
        }
      } else {
        skippedBuckets.push('No he podido reservar un domingo con toda la familia en casa para el pollo asado ni para el arroz especial este mes.');
      }
    }catch(e){ console.warn('regla especial de domingo (pollo asado / arroz) fallida', e); }
  }

  return { days, skippedBuckets: [...new Set(skippedBuckets)] };
}

function summarizePlate(days){
  let veg=0, pro=0, carb=0, n=0;
  for(const day of days){
    for(const slot of Object.keys(day.meals)){
      const rid = day.meals[slot];
      if(!rid) continue;
      const rec = state.recipes.find(r=>r.id===rid);
      if(rec && rec.role==='plato_principal'){
        veg+=rec.plate?.veg||0; pro+=rec.plate?.protein||0; carb+=rec.plate?.carbs||0; n++;
      }
    }
  }
  if(!n) return null;
  return {veg:Math.round(veg/n), protein:Math.round(pro/n), carbs:Math.round(carb/n)};
}

/* ---- Carga de planes ya guardados (para no forzar "Generar" cada vez que
   se navega a otra semana/mes, o simplemente se reabre la pestaña) ---- */
async function loadWeekPlan(weekStart){
  if(!state.db) return null;
  try{
    const snap = await state.db.doc('plans_semana/'+isoWeekKey(weekStart)).get();
    if(snap.exists){
      const data = snap.data();
      if(data && data.weekStart===weekStart && Array.isArray(data.days)) return data.days;
    }
  }catch(e){ console.warn('No se pudo cargar el plan semanal guardado', e); }
  return null;
}
async function loadMonthPlan(mk){
  if(!state.db) return null;
  try{
    const snap = await state.db.doc('plans_mes/'+mk).get();
    if(snap.exists){
      const data = snap.data();
      if(data && data.month===mk && Array.isArray(data.days)) return data.days;
    }
  }catch(e){ console.warn('No se pudo cargar el plan mensual guardado', e); }
  return null;
}
// Recuerda qué semanas/meses ya se han intentado cargar, para no repetir la
// consulta en cada repintado mientras se navega por la pestaña Plan.
const _planLoadAttempts = new Set();
function ensureWeekPlanLoaded(){
  if(state.currentWeekPlan) return;
  const ws = state.weekStart;
  const key = 'w:'+ws;
  if(_planLoadAttempts.has(key)) return;
  _planLoadAttempts.add(key);
  loadWeekPlan(ws).then(days=>{
    if(days && state.weekStart===ws && state.planView==='semanal' && state.tab==='plan' && !state.currentWeekPlan){
      state.currentWeekPlan = days;
      renderMain();
    }
  });
}
function ensureMonthPlanLoaded(){
  if(state.currentMonthPlan) return;
  const mk = state.monthCursor;
  const key = 'm:'+mk;
  if(_planLoadAttempts.has(key)) return;
  _planLoadAttempts.add(key);
  loadMonthPlan(mk).then(days=>{
    if(days && state.monthCursor===mk && state.planView==='mensual' && state.tab==='plan' && !state.currentMonthPlan){
      state.currentMonthPlan = days;
      renderMain();
    }
  });
}

async function persistCurrentPlan(){
  if(!state.db) return;
  try{
    if(state.planView==='semanal' && state.currentWeekPlan){
      await state.db.doc('plans_semana/'+isoWeekKey(state.weekStart)).set({weekStart:state.weekStart, days:state.currentWeekPlan, updatedAt:Date.now()});
    } else if(state.planView==='mensual' && state.currentMonthPlan){
      await state.db.doc('plans_mes/'+state.monthCursor).set({month:state.monthCursor, days:state.currentMonthPlan, updatedAt:Date.now()});
    }
  }catch(e){ console.warn(e); }
}

/* Hoja para elegir qué receta ocupa una comida o el postre de un día.
   onDone, si se pasa, sustituye al cierre-y-repintado por defecto (lo usa
   la ficha de detalle del día para volver a dibujarse a sí misma). */
function openMealPickerSheet(day, field, slot, onDone){
  // Si esta comida se asignó siguiendo el ciclo de categorías (día de
  // legumbre, de pescado…) y estamos cambiando ese mismo slot "comida",
  // ofrecemos por defecto sólo recetas de esa misma categoría. Para el
  // resto de comidas, o si no hay categoría registrada (planes antiguos),
  // se muestra la lista sin restringir, como siempre.
  const restrictCategory = (slot==='comida' && day.comidaCategory) ? day.comidaCategory : null;

    ? state.recipes.filter(r=>r.role==='postre')
    : state.recipes.filter(r=>(r.mealTypes||[]).includes(slot) && (!restrictCategory || r.foodType===restrictCategory))
  ).sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'es'));
  const currentId = field==='dessert' ? day.dessert : (day.meals||{})[slot];
  const label = field==='dessert' ? 'postre' : (MEAL_TYPES.find(m=>m.id===slot)?.label||slot).toLowerCase();

  const rows = [`<button type="button" class="pick-row" data-pickval="">— Sin asignar —${!currentId?' <span class="check">✓</span>':''}</button>`]

  openSheet(`
    <div class="sheet-handle"></div>
    <h2>${esc(heading)}</h2>
    ${categoryLabel ? `<p class="hint">Te propongo otras recetas de ${esc(categoryLabel.toLowerCase())}, para no romper el equilibrio de la semana.</p>` : ''}
    ${!candidates.length ? `<p class="hint">Todavía no tienes ninguna receta que encaje aquí. Añádela primero en Recetas y luego podrás asignarla.</p>` : ''}

      const val = b.dataset.pickval || null;
      if(field==='dessert') day.dessert = val; else { day.meals = day.meals||{}; day.meals[slot] = val; }

======================================================================= */
/* Capitaliza la primera letra de un texto (para mostrar bien los nombres
   de producto que llegan en minúsculas del dictado o de la IA). */
function capitalizeFirst(s){
  s = String(s||'').trim();
  if(!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* Adivina la categoría de un producto de la compra reutilizando las mismas
   listas de palabras clave que guessFoodType, para que funcione igual de
   bien sin conexión a la IA. */
function guessGroceryCategory(name){
  const text = stripAccents(name).toLowerCase();
  for(const cat of Object.keys(FOOD_TYPE_KEYWORDS)){
    for(const kw of FOOD_TYPE_KEYWORDS[cat]){
      if(text.includes(kw)) return cat;
    }
  }
  return 'otro';
}
/* Quita, en bucle, las palabras de relleno típicas de un dictado ("compra",
   "necesito", "y", "también"…) del principio de un fragmento de texto. */
function stripShoppingFiller(frag){
  let prev;
  do{
    prev = frag;
    frag = frag.replace(/^(y|también|tambien)\s+/i,'').trim();
    frag = frag.replace(/^(compra|comprar|necesito|necesitamos|añade|anade|añadir|anadir|dame|pon|apunta|apuntar|quiero|coge|coger)\s+/i,'').trim();
  }while(frag!==prev && frag);
  return frag;
}
/* Reparto de texto en productos individuales sin ayuda de la IA: separa por
   comas, saltos de línea o la palabra "y", y limpia cada fragmento. */
function parseShoppingTextFallback(text){
  const fragments = String(text||'').split(/,|\n| y /i).map(f=>f.trim()).filter(Boolean);
  const seen = new Set();
  const out = [];
  for(let frag of fragments){
    frag = stripShoppingFiller(frag);
    if(!frag) continue;
    const key = stripAccents(frag).toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    out.push({ name: capitalizeFirst(frag), category: guessGroceryCategory(frag) });
  }
  return out;
}
/* Convierte un texto (escrito o dictado, que puede describir uno o varios
   productos a la vez) en una lista de {name, category}. Usa la IA cuando
   está disponible, para separar bien frases naturales tipo "compra
   chocolate, garbanzos y fideos"; si no, recurre al reparto manual. */
async function parseShoppingText(text){
  text = String(text||'').trim();
  if(!text) return [];
  if(state.sample){
    const prompt = `Eres un chef y nutricionista ayudando a preparar una lista de la compra. A partir de este texto, dictado o escrito de viva voz por el usuario en español, identifica cada producto por separado, ignorando palabras de relleno como "compra", "necesito", "añade", "también", "y", las comas, etc.

Texto: """${text}"""

Devuelve SOLO un array JSON, sin texto adicional ni explicación, con este formato exacto:
[{"name": string, "category": string}]

Reglas: "name" es el nombre del producto, con la primera letra en mayúscula (ej. "Chocolate", "Garbanzos", "Fideos"). "category" debe ser exactamente uno de estos valores: "carne","pescado","marisco","legumbre","proteina_vegetal","huevo","lacteo","cereal","verdura","fruta","otro". Usa "verdura" o "fruta" para frutas y verduras frescas, "legumbre" para legumbres, "lacteo" para lácteos y derivados, "huevo" para huevos, y "otro" para cualquier producto que no sea de alimentación (limpieza, higiene, etc.) o que no encaje en ninguna categoría. Si el texto describe varios productos, aunque estén en la misma frase, devuélvelos todos como elementos separados del array: nunca los agrupes en un único elemento.`;
    try{
      const data = await state.sample.json(prompt, {modelTier:'default'});
      const list = Array.isArray(data) ? data : (Array.isArray(data?.items) ? data.items : []);
      const out = list.map(x=>({
        name: capitalizeFirst(String(x?.name||'').trim()),
        category: FOOD_TYPES.some(f=>f.id===x?.category) ? x.category : guessGroceryCategory(String(x?.name||'')),
      })).filter(x=>x.name);
      if(out.length) return out;
    }catch(e){ console.warn('parseShoppingText sample error', e); }
  }
  return parseShoppingTextFallback(text);
}

async function addShoppingItems(items){
  if(!items || !items.length) return;
  if(!state.db){ toast('No hay conexión con la base de datos, así que no he podido guardar la compra.'); return; }
  try{
    for(const it of items){
      await state.db.collection('shopping').add({name:it.name, category: FOOD_TYPES.some(f=>f.id===it.category)?it.category:'otro', checked:false, createdAt:Date.now()});
    }
    toast(items.length>1 ? `Se han añadido ${items.length} productos a la compra` : 'Producto añadido a la compra');
  }catch(e){ console.warn(e); toast('No he podido guardar la compra'); }
}
async function toggleShoppingItem(item){

async function deleteShoppingItem(id){
  if(!state.db) return;
  try{ await state.db.doc('shopping/'+id).delete(); toast('Producto eliminado de la compra'); }
  catch(e){ console.warn(e); toast('No he podido eliminar el producto'); }
}

/* ---- Dictado por voz de la lista de la compra (Web Speech API) ---- */
let shoppingRecognition = null;
let shoppingListening = false;
let shoppingTranscriptAcc = '';

function updateShoppingMicUI(){
  const btn = $('#shopMicBtn');
  if(btn) btn.classList.toggle('listening', shoppingListening);
}
function startShoppingMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Este teléfono no admite el dictado por voz.'); return; }
  try{
    shoppingRecognition = new SR();
    shoppingRecognition.lang = 'es-ES';
    shoppingRecognition.continuous = true;
    shoppingRecognition.interimResults = true;
    shoppingTranscriptAcc = '';
    shoppingRecognition.onresult = (event)=>{
      let finalChunk = '';
      for(let i=event.resultIndex; i<event.results.length; i++){
        if(event.results[i].isFinal) finalChunk += event.results[i][0].transcript + ' ';
      }
      if(finalChunk) shoppingTranscriptAcc += finalChunk;
    };
    shoppingRecognition.onerror = (event)=>{
      console.warn('speech recognition error', event.error);
      if(event.error==='not-allowed' || event.error==='service-not-allowed'){
        toast('No he podido usar el micrófono; revisa los permisos en el navegador.');
      }
    };
    shoppingRecognition.onend = async ()=>{
      const wasListening = shoppingListening;
      shoppingListening = false;
      updateShoppingMicUI();
      const transcript = shoppingTranscriptAcc.trim();
      shoppingTranscriptAcc = '';
      if(wasListening && transcript){
        const items = await parseShoppingText(transcript);
        if(items.length) await addShoppingItems(items);
        else toast('No he identificado ningún producto en el dictado');
      }
    };
    shoppingRecognition.start();
    shoppingListening = true;
    updateShoppingMicUI();
  }catch(e){
    console.warn('mic start error', e);
    toast('No se ha podido iniciar el dictado.');
    shoppingListening = false;
    updateShoppingMicUI();
  }
}
function stopShoppingMic(){
  try{ shoppingRecognition && shoppingRecognition.stop(); }catch(e){}
}
function toggleShoppingMic(){
  if(shoppingListening) stopShoppingMic(); else startShoppingMic();
}

function shopRowHTML(item){
  return `
    <div class="shop-row ${item.checked?'checked':''}" data-shopid="${item.id}">
      <button type="button" class="shop-check ${item.checked?'on':''}" data-shoptoggle="${item.id}" aria-label="${item.checked?'Marcar como pendiente':'Marcar como comprado'}">${item.checked?'✓':''}</button>
      <span class="shop-name">${esc(item.name)}</span>
      <button type="button" class="row-remove" data-shopdelete="${item.id}" aria-label="Quitar de la lista">×</button>
    </div>`;
}
function shopGroupsHTML(list){
  const byCat = {};
  list.forEach(i=>{ const c = FOOD_TYPES.some(f=>f.id===i.category)?i.category:'otro'; (byCat[c]=byCat[c]||[]).push(i); });
  return FOOD_TYPES.map(ft=>{
    const group = byCat[ft.id];
    if(!group || !group.length) return '';
    group.sort((a,b)=> (a.name||'').localeCompare(b.name||'','es'));
    return `
      <div class="shop-group">
        <div class="shop-group-head"><span class="shop-group-icon" style="color:var(--food-${ft.id})">${foodTypeIcon(ft.id,16)}</span> ${esc(ft.label)} · ${group.length}</div>
        ${group.map(shopRowHTML).join('')}
      </div>`;
  }).join('');
}

  return `
    <div class="card shopping-add">

      <div class="row">
        <input type="text" id="shopInput" placeholder="Ej. compra chocolate, garbanzos y fideos…" style="flex:1">

          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg>

      <button type="button" class="btn btn-primary btn-sm" id="shopAddBtn">Añadir</button>
    </div>`;
}

    return `

        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6.2"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>

function wireCompraEvents(){
  const input = $('#shopInput');
  const addBtn = $('#shopAddBtn');
  async function submitInput(){
    if(!input) return;
    const text = input.value.trim();
    if(!text){ toast('Escribe o dicta antes algún producto'); return; }
    addBtn.disabled = true; addBtn.textContent = 'Añadiendo…';
    const items = await parseShoppingText(text);
    addBtn.disabled = false; addBtn.textContent = 'Añadir';
    if(!items.length){ toast('No he identificado ningún producto en ese texto'); return; }
    input.value = '';
    await addShoppingItems(items);
  }
  if(addBtn) addBtn.addEventListener('click', submitInput);
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitInput(); } });

  const micBtn = $('#shopMicBtn');
  if(micBtn) micBtn.addEventListener('click', toggleShoppingMic);

  $all('[data-shoptoggle]').forEach(b=> b.addEventListener('click', ()=>{
    const item = state.shoppingList.find(i=>i.id===b.dataset.shoptoggle);
    if(item) toggleShoppingItem(item);
  }));
  $all('[data-shopdelete]').forEach(b=> b.addEventListener('click', ()=> deleteShoppingItem(b.dataset.shopdelete)));
  const boughtToggle = $('#shopBoughtToggle');
  if(boughtToggle) boughtToggle.addEventListener('click', ()=>{
    const list = $('#shopBoughtList');
    if(list) list.hidden = !list.hidden;
  });
}

/* =======================================================================
   TAB: FAMILIA
======================================================================= */
function currentFamiliaMember(){
  if((!state.familiaMemberId || !state.family.some(m=>m.id===state.familiaMemberId)) && state.family.length){
    state.familiaMemberId = state.family[0].id;
  }
  return state.familiaMemberId;
}

function renderFamilia(){
  if(!state.familiaLocationLoaded && state.db){
    state.familiaLocationLoaded = true; // evita repetir la consulta en cada repintado
    state.db.doc('settings/family').get().then(snap=>{
      if(snap.exists){
        state.familiaLocation = (snap.data()||{}).location || '';
        if(state.tab==='familia') renderMain();
      }
    }).catch(e=> console.warn('No se pudo cargar la configuración de familia', e));
  }
  const familyHTML = state.family.length ? state.family.map(m=>`
    <div class="member-row">
      <span>${esc(m.name)}</span>
      <button class="btn btn-ghost btn-sm" data-removemember="${m.id}">Quitar</button>
    </div>`).join('') : '<p class="hint">Todavía no hay nadie en la familia. Añade aquí a cada persona que suele comer en casa; en cuanto lo hagas, la aplicación contará con todos ellos a la hora de calcular cuántas raciones preparar cada día.</p>';

  const memberId = currentFamiliaMember();
  const memberChips = state.family.map(m=>`<button type="button" class="chip ${m.id===memberId?'on':''}" data-famchip="${m.id}">${esc(m.name)}</button>`).join('');
  const reasonChips = AWAY_REASONS.map(r=>`<button type="button" class="chip ${state.familiaReason===r.id?'on':''}" data-reasonchip="${r.id}">${esc(r.label)}</button>`).join('');

  return `
    <div class="stack">
      <div class="card">
        <h2>Configuración</h2>
        <label class="field-label">Dónde vivimos</label>
        <input type="text" id="famLocation" placeholder="Murcia, España" value="${esc(state.familiaLocation||'')}">
        <p class="hint">Escríbelo una sola vez: no hay acceso a internet desde aquí para detectarlo automáticamente, pero puede servir más adelante para ajustar mejor qué fruta o verdura está de temporada donde vives.</p>
        <button type="button" class="btn btn-primary btn-sm" id="saveFamilyConfigBtn" style="margin-top:8px">Guardar configuración</button>
      </div>

      <div class="card">
        <h2>Quién forma la familia</h2>
        <p class="hint">Por defecto se entiende que toda la familia come en casa todos los días, así que no hace falta marcar nada para eso. Añade aquí a cada persona del hogar; abajo podrás marcar sus ausencias en un calendario.</p>
        <div id="familyList" style="margin-top:12px">${familyHTML}</div>
        <div class="row" style="margin-top:14px;gap:8px">
          <input type="text" id="newMemberName" placeholder="Nombre de la persona">
          <button class="btn btn-primary" id="addMemberBtn">Añadir</button>
        </div>
      </div>

      <div class="card">
        <h2>Días fuera de casa</h2>
        <p class="hint">Elige a la persona y el motivo, y después toca directamente los días del calendario en los que no va a comer en casa. Vuelve a tocar un día ya marcado para quitarlo. Todo lo que no marques se sigue contando como que esa persona come en casa con normalidad.</p>
        ${state.family.length ? `
          <label class="field-label" style="margin-top:14px">Persona</label>
          <div class="row wrap center" style="gap:8px">${memberChips}</div>
          <label class="field-label" style="margin-top:14px">Motivo de la ausencia que vas a marcar</label>
          <div class="row wrap center" style="gap:8px">${reasonChips}</div>
          <div id="famCalendar" style="margin-top:16px"></div>
        ` : '<p class="hint">Añade primero a alguien de la familia arriba; en cuanto lo hagas podrás marcar aquí sus días fuera de casa.</p>'}
      </div>
    </div>
  `;
}

function familiaMonthDates(mk){
  const [y,m] = mk.split('-').map(Number);
  const firstDow = (new Date(mk+'-01T00:00:00').getDay()+6)%7;
  const daysInMonth = new Date(y,m,0).getDate();
  const dates = [];
  for(let i=0;i<firstDow;i++) dates.push(null);
  for(let d=1; d<=daysInMonth; d++) dates.push(`${mk}-${String(d).padStart(2,'0')}`);
  return dates;
}

async function renderFamiliaCalendar(){
  const host = $('#famCalendar');
  if(!host) return;
  const mk = state.familiaMonthCursor;
  const memberId = state.familiaMemberId;
  host.innerHTML = `
    <div class="nav-row">
      <button class="btn btn-ghost btn-sm" id="famPrevMonth">‹</button>
      <span class="navlabel">${monthLabel(mk)}</span>
      <button class="btn btn-ghost btn-sm" id="famNextMonth">›</button>
    </div>
    <div class="cal-legend" style="margin:10px 0"><span class="dot" style="background:var(--protein)"></span><span class="hint">Fuera de casa</span></div>
    <div class="month-grid" id="famMonthGrid">
      ${WEEKDAYS.map(w=>`<div class="month-dow-label">${w}</div>`).join('')}
      <div class="thinking" style="grid-column:1/-1"><span class="spinner"></span> Cargando calendario…</div>
    </div>
  `;
  $('#famPrevMonth').addEventListener('click', ()=>{
    const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-2,1);
    state.familiaMonthCursor = monthKey(todayISO(d)); renderFamiliaCalendar();
  });
  $('#famNextMonth').addEventListener('click', ()=>{
    const [y,m]=mk.split('-').map(Number); const d=new Date(y,m,1);
    state.familiaMonthCursor = monthKey(todayISO(d)); renderFamiliaCalendar();
  });

  const dates = familiaMonthDates(mk);
  const real = dates.filter(Boolean);
  await Promise.all(real.map(d=>getAttendance(d)));

  const grid = $('#famMonthGrid');
  grid.innerHTML = WEEKDAYS.map(w=>`<div class="month-dow-label">${w}</div>`).join('') + dates.map(dateISO=>{
    if(!dateISO) return `<div class="month-cell faded"></div>`;
    const att = state.attendanceCache[dateISO] || {away:[]};
    const isAway = (att.away||[]).some(a=>a.memberId===memberId);
    const dayNum = parseInt(dateISO.slice(-2),10);
    return `<div class="month-cell${isAway?' away-cell':''}" data-famday="${dateISO}"><span class="dnum num">${dayNum}</span></div>`;
  }).join('');

  $all('[data-famday]', grid).forEach(cell=> cell.addEventListener('click', async ()=>{
    const dateISO = cell.dataset.famday;
    const member = state.family.find(m=>m.id===memberId);
    const att = await getAttendanceFresh(dateISO);
    const already = (att.away||[]).some(a=>a.memberId===memberId);
    const away = (att.away||[]).filter(a=>a.memberId!==memberId);
    if(!already) away.push({memberId, name:member?.name||'', reason:state.familiaReason});
    cell.classList.toggle('away-cell', !already);
    await setAttendance(dateISO, away, true);
  }));
}

function wireFamiliaEvents(){
  const saveConfigBtn = $('#saveFamilyConfigBtn');
  if(saveConfigBtn) saveConfigBtn.addEventListener('click', async ()=>{
    const val = $('#famLocation').value.trim();
    if(!state.db){ toast('No hay conexión con la base de datos, así que no he podido guardar la configuración.'); return; }
    saveConfigBtn.disabled = true;
    try{
      await state.db.doc('settings/family').set({location: val, updatedAt: Date.now()});
      state.familiaLocation = val;
      toast('Configuración guardada');
    }catch(e){ console.warn(e); toast('No he podido guardar la configuración'); }
    finally{ saveConfigBtn.disabled = false; }
  });
  $('#addMemberBtn').addEventListener('click', async ()=>{
    const input = $('#newMemberName');
    const name = input.value.trim();
    if(!name){ toast('Escribe primero el nombre de la persona'); return; }
    if(!state.db){ toast('No hay conexión con la base de datos, así que no he podido guardarlo.'); return; }
    try{ await state.db.collection('family').add({name, createdAt:Date.now()}); input.value=''; toast(`${name} se ha añadido a la familia`); }
    catch(e){ toast('No he podido añadir a esta persona.'); }
  });
  $all('[data-removemember]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!state.db) return;
    try{ await state.db.doc('family/'+b.dataset.removemember).delete(); toast('Se ha quitado de la familia'); }
    catch(e){ toast('No he podido quitarlo.'); }
  }));
  $all('[data-famchip]').forEach(b=> b.addEventListener('click', ()=>{
    state.familiaMemberId = b.dataset.famchip; renderMain();
  }));
  $all('[data-reasonchip]').forEach(b=> b.addEventListener('click', ()=>{
    state.familiaReason = b.dataset.reasonchip;
    $all('[data-reasonchip]').forEach(x=> x.classList.toggle('on', x.dataset.reasonchip===state.familiaReason));
  }));
  if($('#famCalendar')) renderFamiliaCalendar();
}

/* =======================================================================
   TAB: APARIENCIA
======================================================================= */
function renderApariencia(){
  const swatches = PALETTES.map(p=>`
    <button type="button" class="palette-swatch ${state.paletteChoice===p.id?'active':''}" data-palette-choice="${p.id}">
      <span class="ring"><span class="dot" style="background:${p.swatch}"></span></span>
      <span>${esc(p.label)}</span>
    </button>`).join('');
  return `
    <div class="stack">
      <div class="card">
        <h2>Claro u oscuro</h2>
        <p class="hint">Elige cómo quieres ver la aplicación. "Automático" sigue el ajuste que ya tengas en el teléfono.</p>
        <div class="segmented" style="margin-top:12px">
          <button data-theme-choice="light" class="${state.themeChoice==='light'?'active':''}">Claro</button>
          <button data-theme-choice="dark" class="${state.themeChoice==='dark'?'active':''}">Oscuro</button>
          <button data-theme-choice="auto" class="${state.themeChoice==='auto'?'active':''}">Automático</button>
        </div>
      </div>
      <div class="card">
        <h2>Gama de color</h2>
        <p class="hint">Elige el tono que más te guste para los botones y los elementos destacados. Los colores del plato (verduras, proteínas, hidratos) no cambian, para que siempre signifiquen lo mismo.</p>
        <div class="palette-row" style="margin-top:14px">${swatches}</div>
      </div>
    </div>
  `;
}

function wireAparienciaEvents(){
  $all('[data-theme-choice]').forEach(b=> b.addEventListener('click', ()=>{
    setThemeChoice(b.dataset.themeChoice);
    renderMain();
  }));
  $all('[data-palette-choice]').forEach(b=> b.addEventListener('click', ()=>{
    setPaletteChoice(b.dataset.paletteChoice);
    renderMain();
  }));
}

/* ---------------------------------------------------------------------
   Wiring dispatcher
--------------------------------------------------------------------- */
function wireCurrentTab(){
  if(state.tab==='recetas') wireRecetasEvents();
  else if(state.tab==='plan') wirePlanEvents();
  else if(state.tab==='compra') wireCompraEvents();
  else if(state.tab==='familia') wireFamiliaEvents();
  else wireAparienciaEvents();
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
async function boot(){
  loadThemeChoice();
  loadPaletteChoice();
  wireLogoutButton();
  await initFirebase();
  if(state.fb && state.fb.auth){
    // Fuera de Claude, con cuenta propia: no se muestra nada de la app
    // hasta saber si hay sesión iniciada o no.
    state.fb.onAuthStateChanged(state.fb.auth, handleAuthChange);
    return;
  }
  // Dentro de Claude (o sin Firebase disponible): comportamiento clásico,
  // sin cuentas, usando la capacidad "db" que presta el propio artefacto.
  showApp();
  renderMain();
  await initCapabilities();
  subscribeCollections();
  if(!state.db){
    // still let the person use the form fields; persistence just won't work
    console.warn('db capability unavailable in this view');
  }
}

if(window.claude?.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
} else {
  boot();
}

})();
</script>

     si esta página se abre dentro de un artefacto de Claude, no pasa
     nada porque los service workers ahí no están disponibles y esto
     simplemente no hace nada). -->
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
