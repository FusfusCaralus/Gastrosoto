<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastrosoto</title>
<meta name="description" content="Recetas y planificación de menús semanales y mensuales para tu familia.">

<!-- Instalable como app (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6E8F72">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastrosoto">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F1F0E8;
    --surface:#FFFFFF;
    --surface-2:#E9E7DC;
    --ink:#333B31;
    --ink-soft:#7C8578;
    --line:#DFDDCF;
    --veg:#6E8F72;
    --veg-soft:#E6EBE0;
    --protein:#C4906F;
    --protein-soft:#F2E5DA;
    --carb:#D3B36E;
    --carb-soft:#F3ECD9;
    --danger:#B57462;
    --shadow: 0 1px 1px rgba(51,59,49,.04), 0 3px 10px rgba(51,59,49,.045);
    --radius: 10px;
    --radius-sm: 7px;

    /* Colores por categoría de alimento (FOOD_TYPES), para dar algo más de
       color a los iconos de receta sin tocar los colores semánticos del
       plato de Harvard (--veg/--protein/--carb, que no cambian). "verdura"
       reutiliza --veg y "otro" reutiliza los neutros de siempre. */
    --food-carne:#B9563E; --food-carne-soft:#F5DCD3;
    --food-pescado:#4E7A8C; --food-pescado-soft:#DCEBEF;
    --food-marisco:#C97A6B; --food-marisco-soft:#F6E1DB;
    --food-legumbre:#8C6A3A; --food-legumbre-soft:#EFE3CD;
    --food-proteina_vegetal:#4F8156; --food-proteina_vegetal-soft:#E1EBDD;
    --food-huevo:#C79A3D; --food-huevo-soft:#F6ECD3;
    --food-lacteo:#C9AF7A; --food-lacteo-soft:#F5EFDD;
    --food-cereal:#C08A3E; --food-cereal-soft:#F3E2C5;
    --food-verdura: var(--veg); --food-verdura-soft: var(--veg-soft);
    --food-fruta:#D2673F; --food-fruta-soft:#F7E0D2;
    --food-otro: var(--ink-soft); --food-otro-soft: var(--surface-2);

    /* Accent: the chosen colour scheme (Apariencia). Kept separate from
       --veg/--protein/--carb, which always mean the same nutrition
       groups regardless of the scheme picked. */
    --accent-light:#6E8F72; --accent-soft-light:#E6EBE0;
    --accent-dark:#8FB093;  --accent-soft-dark:#2B342C;
    --accent: var(--accent-light);
    --accent-soft: var(--accent-soft-light);
  }
  :root[data-palette="terracota"]{ --accent-light:#BE6E4E; --accent-soft-light:#F3E1D6; --accent-dark:#DE9A78; --accent-soft-dark:#3A2A21; }
  :root[data-palette="oliva"]{ --accent-light:#A98A3A; --accent-soft-light:#F1E8CE; --accent-dark:#D9BB6E; --accent-soft-dark:#362D18; }
  :root[data-palette="pizarra"]{ --accent-light:#56708A; --accent-soft-light:#E2E9EE; --accent-dark:#93AFC4; --accent-soft-dark:#26323C; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1F1B;
      --surface:#242924;
      --surface-2:#2C322B;
      --ink:#E7E9E2;
      --ink-soft:#9AA495;
      --line:#3B423A;
      --veg:#8FB093;
      --veg-soft:#2B342C;
      --protein:#D2A688;
      --protein-soft:#3A2F27;
      --carb:#D9C089;
      --carb-soft:#39331F;
      --danger:#D19E8E;
      --shadow: 0 1px 1px rgba(0,0,0,.22), 0 3px 10px rgba(0,0,0,.22);
      --accent: var(--accent-dark);
      --accent-soft: var(--accent-soft-dark);
      --food-carne:#E08B70; --food-carne-soft:#3D2620;
      --food-pescado:#7FB0C2; --food-pescado-soft:#223438;
      --food-marisco:#E2A395; --food-marisco-soft:#3B2A24;
      --food-legumbre:#C7A671; --food-legumbre-soft:#362B18;
      --food-proteina_vegetal:#8FBF8E; --food-proteina_vegetal-soft:#26332A;
      --food-huevo:#E0BC6E; --food-huevo-soft:#3A311C;
      --food-lacteo:#D8C08C; --food-lacteo-soft:#362F20;
      --food-cereal:#DFAE6E; --food-cereal-soft:#392C18;
      --food-fruta:#E89468; --food-fruta-soft:#3C2A1E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1F1B;
    --surface:#242924;
    --surface-2:#2C322B;
    --ink:#E7E9E2;
    --ink-soft:#9AA495;
    --line:#3B423A;
    --veg:#8FB093;
    --veg-soft:#2B342C;
    --protein:#D2A688;
    --protein-soft:#3A2F27;
    --carb:#D9C089;
    --carb-soft:#39331F;
    --danger:#D19E8E;
    --shadow: 0 1px 1px rgba(0,0,0,.22), 0 3px 10px rgba(0,0,0,.22);
    --accent: var(--accent-dark);
    --accent-soft: var(--accent-soft-dark);
    --food-carne:#E08B70; --food-carne-soft:#3D2620;
    --food-pescado:#7FB0C2; --food-pescado-soft:#223438;
    --food-marisco:#E2A395; --food-marisco-soft:#3B2A24;
    --food-legumbre:#C7A671; --food-legumbre-soft:#362B18;
    --food-proteina_vegetal:#8FBF8E; --food-proteina_vegetal-soft:#26332A;
    --food-huevo:#E0BC6E; --food-huevo-soft:#3A311C;
    --food-lacteo:#D8C08C; --food-lacteo-soft:#362F20;
    --food-cereal:#DFAE6E; --food-cereal-soft:#392C18;
    --food-fruta:#E89468; --food-fruta-soft:#3C2A1E;
  }

  *{box-sizing:border-box;}
  /* #app, nav.tabbar, .auth-gate y .icon-btn fijan su propio "display"
     con una especificidad mayor que la regla por defecto del navegador
     para [hidden] (display:none), así que sin esto el atributo "hidden"
     no llegaba a ocultarlos de verdad: se veían apilados unos encima de
     otros (la pantalla de acceso Y la app a la vez, con scroll). */
  [hidden]{ display:none !important; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',-apple-system,system-ui,sans-serif;
    padding-inline:0;
    height:100%;
    overflow-x:hidden;
  }
  html{height:100%;}
  h1,h2,h3,.display{
    font-family:'Manrope',-apple-system,system-ui,sans-serif;
    font-weight:700;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  .mono, .num{ font-family:'Manrope',-apple-system,system-ui,sans-serif; font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }

  #app{
    display:flex;
    flex-direction:column;
    min-height:100%;
    padding-bottom: calc(72px + env(safe-area-inset-bottom,0px));
  }

  header.topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:var(--bg);
    padding:18px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  header.topbar h1{ font-size:22px; margin:0 0 2px; color:var(--ink); }
  header.topbar p{ margin:0; font-size:13px; color:var(--ink-soft); }

  main{ flex:1; padding:16px 16px 8px; max-width:640px; margin:0 auto; width:100%; }

  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:space-around;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  }
  nav.tabbar button{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-size:11px; font-family:inherit; padding:4px 10px; border-radius:10px;
    cursor:pointer;
  }
  nav.tabbar button svg{ width:22px; height:22px; stroke:var(--ink-soft); fill:none; stroke-width:1.7; }
  nav.tabbar button.active{ color:var(--accent); }
  nav.tabbar button.active svg{ stroke:var(--accent); }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .card h2{ font-size:16.5px; margin:0 0 7px; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .stack.tight{ gap:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .wrap{ flex-wrap:wrap; }
  .wrap.center{ justify-content:center; }

  .filter-bar{ display:flex; gap:8px; }
  .filter-btn{
    position:relative; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 14px; display:flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
  }
  .filter-btn svg{ width:16px; height:16px; stroke:var(--ink-soft); fill:none; stroke-width:1.8; }
  .filter-btn .fcount{
    background:var(--accent); color:var(--surface); font-size:10.5px; font-weight:800; min-width:16px; height:16px;
    border-radius:8px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .filter-group + .filter-group{ margin-top:16px; }

  .btn{
    font-family:inherit; font-size:14px; font-weight:600; border-radius:var(--radius); border:1px solid transparent;
    padding:12px 18px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn-primary{ background:var(--accent); color:var(--surface); }
  .btn-primary:active{ opacity:.85; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:active{ background:var(--surface-2); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:var(--protein-soft); }
  .btn-sm{ padding:8px 14px; font-size:12.5px; border-radius:var(--radius-sm); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .fab{
    position:fixed; right:20px; bottom:calc(88px + env(safe-area-inset-bottom,0px)); z-index:25;
    background:var(--accent); color:var(--surface); border:none; width:52px; height:52px; border-radius:var(--radius);
    box-shadow:var(--shadow); font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    line-height:1;
  }

  input[type=text], input[type=number], input[type=date], textarea, select{
    font-family:inherit; font-size:14.5px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 12px; width:100%;
  }
  textarea{ resize:vertical; min-height:110px; line-height:1.55; }
  label.field-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:4px; display:block; }

  .chip{
    font-size:13px; padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink-soft); cursor:pointer; user-select:none; white-space:nowrap;
  }
  .chip.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .chip.static{ cursor:default; user-select:text; }

  .badge{ font-size:10.5px; padding:2px 7px; border-radius:var(--radius-sm); background:var(--surface-2); color:var(--ink-soft); font-weight:600; }
  .badge.veg{ background:var(--veg-soft); color:var(--veg); }
  .badge.protein{ background:var(--protein-soft); color:var(--protein); }
  .badge.carb{ background:var(--carb-soft); color:var(--carb); }

  .plate-dot{ border-radius:50%; flex-shrink:0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .plate-dot.na{ background:var(--surface-2)!important; border:1.5px dashed var(--line); }

  .food-icon{ border-radius:50%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  /* Color por categoría de alimento: fondo suave + trazo del icono, para
     distinguir de un vistazo carne/pescado/verdura/etc. sin tocar los
     colores semánticos del plato de Harvard. */
  .food-icon-carne{ background:var(--food-carne-soft); color:var(--food-carne); border-color:transparent; }
  .food-icon-pescado{ background:var(--food-pescado-soft); color:var(--food-pescado); border-color:transparent; }
  .food-icon-marisco{ background:var(--food-marisco-soft); color:var(--food-marisco); border-color:transparent; }
  .food-icon-legumbre{ background:var(--food-legumbre-soft); color:var(--food-legumbre); border-color:transparent; }
  .food-icon-proteina_vegetal{ background:var(--food-proteina_vegetal-soft); color:var(--food-proteina_vegetal); border-color:transparent; }
  .food-icon-huevo{ background:var(--food-huevo-soft); color:var(--food-huevo); border-color:transparent; }
  .food-icon-lacteo{ background:var(--food-lacteo-soft); color:var(--food-lacteo); border-color:transparent; }
  .food-icon-cereal{ background:var(--food-cereal-soft); color:var(--food-cereal); border-color:transparent; }
  .food-icon-verdura{ background:var(--food-verdura-soft); color:var(--food-verdura); border-color:transparent; }
  .food-icon-fruta{ background:var(--food-fruta-soft); color:var(--food-fruta); border-color:transparent; }

  /* Indicador de procedencia de la receta: un pequeño icono de color en
     lugar de la antigua pastilla de texto. Se usa como esquina superpuesta
     sobre el icono de plato (.food-icon-wrap) o, en modo "inline", suelto
     junto a una línea de texto. */
  .food-icon-wrap{ position:relative; flex-shrink:0; display:inline-flex; }
  .prov-badge{
    position:absolute; top:-3px; right:-3px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface); box-shadow:var(--shadow);
  }
  .prov-badge.inline{ position:static; border:none; box-shadow:none; }
  .prov-badge.ai, .prov-badge.adapted{ background:var(--accent); color:var(--surface); }
  .prov-badge.own{ background:var(--veg); color:var(--surface); }

  .recipe-card{ cursor:pointer; padding:12px 14px; }
  .recipe-card:active{ background:var(--surface-2); }
  .recipe-card h3{ font-size:15.5px; margin:0 0 1px; }
  .recipe-card .meta{ font-size:11.5px; color:var(--ink-soft); }

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,26,20,.45); z-index:50; display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0;
    padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 12px; }
  .sheet h2{ font-size:18px; margin:0 0 10px; }
  .sheet-topbar{ display:flex; align-items:center; gap:6px; margin:0 0 8px; }
  .sheet-topbar h2{ margin:0; flex:1; }
  .sheet-back{
    background:none; border:none; color:var(--ink); display:flex; align-items:center; justify-content:center;
    width:36px; height:36px; padding:0; cursor:pointer; flex-shrink:0; border-radius:var(--radius-sm); margin-left:-6px;
  }
  .sheet-back:active{ background:var(--surface-2); }
  .sheet-back svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; }

  .ing-row{
    display:grid; grid-template-columns:1fr 56px 68px 24px; gap:6px; align-items:center;
    background:var(--surface-2); border-radius:var(--radius-sm); padding:6px 7px;
  }
  .ing-row input{ background:var(--surface); min-width:0; padding:7px 7px; font-size:13px; }
  .ing-row .row-remove{ justify-self:center; padding:0; }
  .step-row{ display:flex; gap:8px; align-items:flex-start; }
  .step-row textarea{ min-height:40px; flex:1; }
  .row-remove{ background:none; border:none; color:var(--danger); font-size:20px; cursor:pointer; padding:2px 6px; flex-shrink:0; }

  .sheet-tabbar{ margin:10px 0; }
  .food-type-picker{ display:flex; flex-wrap:wrap; gap:7px; }
  .food-type-picker .chip{ display:inline-flex; align-items:center; gap:6px; }
  .food-type-picker .chip svg{ flex-shrink:0; }
  .tts-btn{ display:inline-flex; align-items:center; gap:7px; margin-bottom:12px; }
  .tts-btn.speaking{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  .empty{ text-align:center; padding:40px 16px; color:var(--ink-soft); }
  .empty svg{ width:44px; height:44px; stroke:var(--ink-soft); margin-bottom:10px; }

  .segmented{ display:flex; background:var(--surface-2); border-radius:var(--radius); padding:4px; gap:2px; }
  .segmented button{ flex:1; border:none; background:none; padding:9px 10px; font-size:13.5px; font-weight:600; color:var(--ink-soft); border-radius:var(--radius-sm); font-family:inherit; cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  .day-card{ display:flex; flex-direction:column; gap:10px; }
  .day-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .day-head .dow{ font-weight:700; font-size:16px; }
  .day-head .diners{ font-size:12px; color:var(--ink-soft); }
  .meal-slot{ display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .meal-slot:first-of-type{ border-top:none; }
  .meal-slot .slot-name{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); width:64px; flex-shrink:0; }
  .meal-slot .slot-body{ flex:1; min-width:0; }

  .recipe-link{
    all:unset; cursor:pointer; font-size:14px; font-weight:600; color:var(--ink); text-align:left;
    display:block; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .recipe-link:disabled{ color:var(--ink-soft); font-weight:500; cursor:default; }
  .recipe-link:active:not(:disabled){ color:var(--accent); }

  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
  }
  .icon-btn svg{ width:16px; height:16px; stroke:var(--ink-soft); fill:none; stroke-width:1.8; }
  .icon-btn:active{ background:var(--line); }

  .day-extra{ margin-top:2px; padding-top:10px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:10px; }
  .fruit-basket{ display:flex; align-items:flex-start; gap:10px; }
  .fruit-basket .slot-name{ width:64px; flex-shrink:0; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding-top:7px; }

  .pick-row{
    all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; padding:12px 2px; border-top:1px solid var(--line); font-family:inherit; font-size:14.5px;
    color:var(--ink); cursor:pointer;
  }
  .pick-row:first-child{ border-top:none; }
  .pick-row:active{ background:var(--surface-2); }
  .pick-row .check{ color:var(--accent); font-weight:800; flex-shrink:0; }

  .nav-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
  .nav-row .navlabel{ text-align:center; font-weight:700; font-size:15px; text-transform:capitalize; }
  .nav-row .btn:first-child{ justify-self:start; }
  .nav-row .btn:last-child{ justify-self:end; }

  .whocard{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius); padding:14px 16px; }
  .whocard h3{ font-size:13px; margin:0 0 6px; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; font-weight:800; }
  .whocard ul{ margin:0; padding-left:18px; font-size:13px; color:var(--ink); }
  .whocard li{ margin-bottom:3px; }

  .palette-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .palette-swatch{ display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; font-family:inherit; padding:2px; }
  .palette-swatch .dot{ width:36px; height:36px; border-radius:50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .palette-swatch .ring{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
  .palette-swatch.active .ring{ border-color:var(--ink); }
  .palette-swatch span{ font-size:11.5px; color:var(--ink-soft); }
  .palette-swatch.active span{ color:var(--ink); font-weight:700; }

  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .month-cell{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px 5px; min-height:58px; font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }

/* Devuelve el icono SVG del tipo de alimento (o el de "otro" si no hay

/* ---- Indicador de procedencia de la receta (icono de color, no pastilla de texto) ---- */
const PROV_ICONS = {

function provenanceBadgeHTML(r, size, inline){

  return `<span class="${cls}" style="width:${size}px;height:${size}px" title="${esc(provenanceTitle(r))}" aria-label="${esc(provenanceTitle(r))}">${provenanceIcon(kind, Math.round(size*0.6))}</span>`;

   palabras clave por categoría. No pretende ser perfecto: es sólo una
   ayuda para no tener que elegirlo siempre a mano. */
const FOOD_TYPE_KEYWORDS = {
  carne: ['pollo','pavo','ternera','cerdo','cordero','carne','jamon','chorizo','panceta','solomillo','chuleta','conejo','vacuno','bacon','lomo'],
  pescado: ['salmon','merluza','atun','bacalao','caballa','dorada','lubina','pescado','trucha','rape','boqueron','sardina','gallo','lenguado'],
  marisco: ['gamba','langostino','mejillon','calamar','marisco','pulpo','sepia','almeja','cigala','camaron','navaja','percebe'],
  legumbre: ['lenteja','garbanzo','judia','alubia','legumbre','haba'],
  proteina_vegetal: ['tofu','seitan','tempeh','soja','soya','heura'],
  huevo: ['huevo'],
  lacteo: ['queso','yogur','leche','nata','requeson','cuajada','mantequilla'],
  cereal: ['arroz','pasta','harina','pan','quinoa','cuscus','avena','espagueti','macarron','fideo','trigo','maiz','tortilla de maiz'],
  verdura: ['lechuga','tomate','calabacin','pimiento','cebolla','zanahoria','verdura','espinaca','brocoli','puerro','calabaza','berenjena','champinon','seta','acelga','pepino','ajo'],
  fruta: ['manzana','platano','naranja','fresa','pera','fruta','melon','sandia','uva','kiwi','melocoton','ciruela','albaricoque'],
};
function stripAccents(s){
  try{ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
  catch(e){ return String(s||''); }
}
function guessFoodType(rec){
  const texts = [stripAccents(rec?.name).toLowerCase()]
    .concat((rec?.ingredients||[]).map(i=> stripAccents(i?.name).toLowerCase()));
  const counts = {};
  for(const text of texts){
    if(!text) continue;
    for(const cat of Object.keys(FOOD_TYPE_KEYWORDS)){
      for(const kw of FOOD_TYPE_KEYWORDS[cat]){
        if(text.includes(kw)) counts[cat] = (counts[cat]||0) + 1;
      }
    }
  }
  let best = 'otro', bestScore = 0;
  for(const cat of Object.keys(counts)){
    if(counts[cat] > bestScore){ bestScore = counts[cat]; best = cat; }
  }
  return best;
}

/* Adivina el estilo de cocción a partir del nombre del plato; "otro" si no
   encaja con ninguna palabra clave conocida. */
function guessCookStyle(rec){
  const text = stripAccents(rec?.name).toLowerCase();
  for(const [id,kw] of COOK_STYLE_KEYWORDS){

  }

const WEEKDAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function todayISO(d){ d = d||new Date(); return d.toISOString().slice(0,10); }
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return todayISO(d); }
function startOfWeek(iso){ const d = new Date(iso+'T00:00:00'); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return todayISO(d); }
function isoWeekKey(iso){
  const d = new Date(iso+'T00:00:00');
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const diff = target - firstThursday;
  const week = 1 + Math.round(diff/(7*24*3600*1000));
  return target.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function fmtDateHuman(iso){
  const d = new Date(iso+'T00:00:00');
  return WEEKDAYS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(mk){ const [y,m]=mk.split('-'); return MONTHS[parseInt(m,10)-1]+' '+y; }
function seasonForMonth(m){ // m 1-12, Spain hemisphere
  if([12,1,2].includes(m)) return 'invierno';
  if([6,7,8].includes(m)) return 'verano';
  return 'entretiempo';
}

function toast(msg){
  const host = $('#toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

function plateDot(plate, size){
  size = size||30;
  if(!plate || ((plate.veg||0)+(plate.protein||0)+(plate.carbs||0)) < 5){
    return `<div class="plate-dot na" style="width:${size}px;height:${size}px"></div>`;
  }
  const veg = Math.max(0,plate.veg||0), pro = Math.max(0,plate.protein||0), carb = Math.max(0,plate.carbs||0);
  const total = veg+pro+carb || 1;
  const p1 = veg/total*100, p2 = (veg+pro)/total*100;
  const bg = `conic-gradient(var(--veg) 0% ${p1}%, var(--protein) ${p1}% ${p2}%, var(--carb) ${p2}% 100%)`;
  return `<div class="plate-dot" style="width:${size}px;height:${size}px;background:${bg}"></div>`;
}

function harvardScore(plate){
  // distance from ideal 50/25/25, lower is better
  if(!plate) return 999;
  const veg = plate.veg||0, pro = plate.protein||0, carb = plate.carbs||0;
  return Math.abs(veg-50) + Math.abs(pro-25) + Math.abs(carb-25);
}

   Acceso con cuenta propia (fuera de Claude): Firebase Authentication +
   Firestore. Cada cuenta ve únicamente sus propios datos, guardados bajo

// Espera a que el módulo de Firebase (declarado en el HTML) esté listo,
// con un margen de tiempo por si esta misma página se abre dentro de un
// artefacto de Claude, donde no se pueden cargar scripts externos y esa
// promesa nunca llegaría a resolverse por sí sola.
async function initFirebase(){
  try{
    state.fb = await Promise.race([
      window.__firebaseReady,
      new Promise(resolve=> setTimeout(()=>resolve(null), 4000)),
    ]);
  }catch(e){ state.fb = null; }
}

// Adaptador con la misma forma que la capacidad "db" de Claude
// (collection().onSnapshot()/.add(), doc().get()/.set()/.update()/.delete())
// pero respaldado por Firestore de verdad, con todo escrito bajo
// users/{uid}/... para que cada cuenta tenga sus propios datos.
function makeFirestoreDb(fb, uid){
  const { firestore, collection, doc, onSnapshot, getDoc, setDoc, updateDoc, deleteDoc, addDoc } = fb;
  const full = (path) => `users/${uid}/${path}`;
  return {
    collection(path){
      const ref = collection(firestore, full(path));
      return {
        onSnapshot(cb, errCb){
          return onSnapshot(ref, snap=> cb({docs: snap.docs}), errCb);
        },
        add(data){ return addDoc(ref, data); },
      };
    },
    doc(path){
      const ref = doc(firestore, full(path));
      return {
        async get(){
          const s = await getDoc(ref);
          return { exists: s.exists(), data: ()=> s.data() };
        },
        set(data){ return setDoc(ref, data); },
        update(data){ return updateDoc(ref, data); },
        delete(){ return deleteDoc(ref); },
      };
    },
  };
}

  });

  $('#authSubmitBtn', host)?.addEventListener('click', submitAuthForm);
  $('#authForgotBtn', host)?.addEventListener('click', doForgotPassword);
}

function authErrorMessage(e){
  const code = e && e.code;
  const MAP = {
    'auth/invalid-email': 'Ese correo no parece válido.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo; prueba a iniciar sesión.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/user-not-found': 'No hay ninguna cuenta con ese correo.',
    'auth/wrong-password': 'La contraseña no es correcta.',
    'auth/invalid-credential': 'El correo o la contraseña no son correctos.',
    'auth/too-many-requests': 'Demasiados intentos seguidos; espera un momento y vuelve a intentarlo.',
    'auth/network-request-failed': 'No hay conexión; comprueba tu red e inténtalo de nuevo.',
  };
  return MAP[code] || 'No se ha podido completar la operación. Inténtalo de nuevo.';
}

async function submitAuthForm(){
  if(!state.fb) return;
  const host = $('#authGate');
  const email = ($('#authEmail', host)?.value||'').trim();
  const password = $('#authPassword', host)?.value||'';
  const isRegister = state.authView === 'register';
  state.authEmailDraft = email;
  if(!email || !password){ state.authError = 'Escribe tu correo y tu contraseña.'; showAuthGate(); return; }
  if(isRegister){
    const password2 = $('#authPassword2', host)?.value||'';
    if(password.length < 6){ state.authError = 'La contraseña debe tener al menos 6 caracteres.'; showAuthGate(); return; }
    if(password !== password2){ state.authError = 'Las contraseñas no coinciden.'; showAuthGate(); return; }
  }
  const btn = $('#authSubmitBtn', host);
  if(btn){ btn.disabled = true; btn.textContent = 'Un momento…'; }
  try{
    if(isRegister){
      await state.fb.createUserWithEmailAndPassword(state.fb.auth, email, password);
    } else {
      await state.fb.signInWithEmailAndPassword(state.fb.auth, email, password);
    }
    state.authError = '';
    // onAuthStateChanged se encarga de mostrar la app al confirmarse el acceso.
  }catch(e){
    console.warn('auth error', e);
    state.authError = authErrorMessage(e);
    showAuthGate();
  }
}

async function doForgotPassword(){
  if(!state.fb) return;
  const host = $('#authGate');
  const email = ($('#authEmail', host)?.value||'').trim();
  if(!email){ state.authError = 'Escribe primero tu correo para poder enviarte el enlace.'; showAuthGate(); return; }
  try{
    await state.fb.sendPasswordResetEmail(state.fb.auth, email);
    state.authError = '';
    showAuthGate();
    toast('Te hemos enviado un correo para restablecer tu contraseña');
  }catch(e){
    console.warn('forgot password error', e);
    state.authError = authErrorMessage(e);
    showAuthGate();
  }
}

}

function subscribeCollections(){

  try{
    const unsub = state.db.collection('recipes').onSnapshot(snap=>{

    if(unsub) state._unsubs.push(unsub);
  }catch(e){}
  try{

      state.family = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(state.tab==='familia') renderMain();

async function getAttendance(dateISO){
  if(state.attendanceCache[dateISO] !== undefined) return state.attendanceCache[dateISO];
  return getAttendanceFresh(dateISO);
}

async function getAttendanceFresh(dateISO){
  if(!state.db){ const empty={away:[]}; state.attendanceCache[dateISO]=empty; return empty; }
  try{
    const snap = await state.db.doc('attendance/'+dateISO).get();
    const data = snap.exists ? snap.data() : {away:[]};
    state.attendanceCache[dateISO] = data;
    return data;
  }catch(e){ return {away:[]}; }
}

async function setAttendance(dateISO, away, quiet){
  state.attendanceCache[dateISO] = {date:dateISO, away};
  if(!state.db){ toast('No hay conexión con la base de datos, así que no he podido guardar este día.'); return; }
  try{
    await state.db.doc('attendance/'+dateISO).set({date:dateISO, away});
    if(!quiet) toast('Día actualizado');
  }catch(e){ toast('No he podido guardar este día'); }
}

    r.season && r.season!=='todo_el_año' ? `<span class="badge">${esc(SEASONS.find(s=>s.id===r.season)?.label||r.season)}</span>` : '',
    (r.mealTypes||[]).map(mt=>`<span class="badge">${esc(MEAL_TYPES.find(m=>m.id===mt)?.label||mt)}</span>`).join(''),
  ].join('');
  return `
    <div class="card recipe-card row" data-recipeid="${r.id}">
      <div class="food-icon-wrap">${foodIconBadge(r.foodType, 42)}${provenanceBadgeHTML(r, 18)}</div>
      <div style="flex:1;min-width:0">
        <h3>${esc(r.name||'Sin nombre')}</h3>
        <div class="meta">${r.timeMinutes?`${r.timeMinutes} min · `:''}${r.servings?`${r.servings} raciones`:''}</div>
        <div class="row wrap" style="gap:5px;margin-top:6px">${badges}</div>
      </div>
    </div>`;
}

function wireDictationStep(draft){
  wireSheetBack();
  $all('[data-premeal]').forEach(b=> b.addEventListener('click', ()=>{
    const id=b.dataset.premeal;
    const i = draft.preMealTypes.indexOf(id);
    if(i>-1) draft.preMealTypes.splice(i,1); else draft.preMealTypes.push(id);
    b.classList.toggle('on');
  }));
  const rawTextEl = $('#rawText');
  const actionHost = $('#dictationAction');
  function renderActions(thinking){
    const canSample = !!state.sample;
    actionHost.innerHTML = `
      ${thinking ? `<div class="thinking"><span class="spinner"></span> Analizando la receta…</div>` : ''}
      <div class="row" style="gap:10px">
        ${canSample ? `<button class="btn btn-primary btn-block" id="analyzeBtn" ${thinking?'disabled':''}>Analizar con IA</button>` : ''}
        <button class="btn ${canSample?'btn-ghost':'btn-primary'} btn-block" id="manualBtn" ${thinking?'disabled':''}>Rellenar a mano</button>
      </div>
    `;
    const a = $('#analyzeBtn'); if(a) a.addEventListener('click', doAnalyze);
    const m = $('#manualBtn'); if(m) m.addEventListener('click', ()=>{
      const rec = blankRecipe();
      rec.rawDictation = rawTextEl.value.trim();
      rec.mealTypes = draft.preMealTypes.slice();
      if($('#preTemp').value) rec.temp = $('#preTemp').value;
      if($('#preTime').value) rec.timeMinutes = parseInt($('#preTime').value,10);
      if(rawTextEl.value.trim()) rec.steps = [rawTextEl.value.trim()];
      rec.foodType = guessFoodType(rec);
      rec.cookStyle = guessCookStyle(rec);
      renderRecipeForm(rec, null);
    });
  }
  renderActions(false);

  async function doAnalyze(){
    const raw = rawTextEl.value.trim();
    if(!raw){ toast('Dicta o escribe algo primero'); return; }
    renderActions(true);
    const prompt = `Eres un chef y nutricionista. A partir del siguiente texto dictado de viva voz por un usuario sobre una receta de cocina casera, extrae la información estructurada.

Texto dictado:
"""${raw}"""

Devuelve SOLO un objeto JSON, sin ningún texto adicional ni explicación, con este formato exacto:
{
  "name": string,
  "ingredients": [{"name": string, "amount": string, "unit": string}],
  "steps": [string, ...],
  "timeMinutes": number,
  "servings": number,
  "mealTypes": array con las que correspondan entre "desayuno","almuerzo","comida","cena","merienda",
  "temp": "fria" | "caliente" | "ambas",
  "season": "invierno" | "verano" | "entretiempo" | "todo_el_año",
  "role": "plato_principal" | "guarnicion" | "postre" | "desayuno_item" | "bebida",
  "plate": {"veg": number, "protein": number, "carbs": number},
  "foodType": "carne" | "pescado" | "marisco" | "legumbre" | "proteina_vegetal" | "huevo" | "lacteo" | "cereal" | "verdura" | "fruta" | "otro",
  "mainIngredientDetail": string,
  "weight": "ligero" | "contundente",
  "cookStyle": "estofado" | "ensalada" | "horno" | "plancha" | "guiso" | "pure" | "salteado" | "asado" | "wok" | "sopa" | "crema" | "frito" | "otro"
}

Reglas: "amount" es texto libre (ej. "2", "1/2", "al gusto"); "unit" vacío si no aplica. Los "steps" van en español, uno por elemento, en orden, en infinitivo o imperativo, sin numerarlos tú (yo los numero). "timeMinutes" es el tiempo total estimado (preparación + cocción) en minutos. "servings" son las raciones; estima 4 si no se menciona. Si role es "plato_principal", estima el reparto aproximado en porcentaje del plato según el método del plato de Harvard (mitad verduras y frutas, un cuarto proteínas, un cuarto cereales integrales o hidratos de carbono) y procura favorecer una buena proporción de verduras; si no es plato principal, usa 0 en veg, protein y carbs. "foodType" es la categoría del ingrediente protagonista del plato (elige la que mejor encaje, "otro" si no encaja en ninguna). "mainIngredientDetail" es ese ingrediente concreto en una o dos palabras (ej. "lentejas", "pollo", "caballa", "calabacín"). "weight" indica si el plato es ligero o contundente: usa "contundente" para guisos, platos de cuchara, arroces o carnes copiosas, y "ligero" para ensaladas, cremas, platos fríos o pescados suaves. "cookStyle" es el estilo de cocción predominante del plato (elige el que mejor encaje, "otro" si no encaja en ninguno). Si el usuario ya dijo explícitamente el tiempo, las raciones, si se sirve fría o caliente, la temporada o el tipo de comida, respeta exactamente lo que dijo en vez de estimarlo. Datos ya indicados por el usuario: tipo de comida=${draft.preMealTypes.join(',')||'sin indicar'}; se sirve=${$('#preTemp').value||'sin indicar'}; tiempo en minutos=${$('#preTime').value||'sin indicar'}.`;
    try{
      const data = await state.sample.json(prompt, {modelTier:'default'});
      const rec = blankRecipe();
      rec.name = String(data.name||'').trim();
      rec.ingredients = Array.isArray(data.ingredients) && data.ingredients.length ? data.ingredients.map(i=>({name:String(i.name||''), amount:String(i.amount||''), unit:String(i.unit||'')})) : blankRecipe().ingredients;
      rec.steps = Array.isArray(data.steps) && data.steps.length ? data.steps.map(String) : [''];
      rec.timeMinutes = draft.preTime ? parseInt(draft.preTime,10) : (Number.isFinite(data.timeMinutes)? Math.round(data.timeMinutes): null);
      rec.servings = Number.isFinite(data.servings) ? Math.round(data.servings) : 4;
      rec.mealTypes = draft.preMealTypes.length ? draft.preMealTypes.slice() : (Array.isArray(data.mealTypes)? data.mealTypes.filter(m=>MEAL_TYPES.some(x=>x.id===m)) : []);
      rec.temp = $('#preTemp').value || (['fria','caliente','ambas'].includes(data.temp)? data.temp : 'ambas');
      rec.season = ['invierno','verano','entretiempo','todo_el_año'].includes(data.season) ? data.season : 'todo_el_año';
      rec.role = ROLES.some(x=>x.id===data.role) ? data.role : 'plato_principal';
      rec.plate = {
        veg: Number.isFinite(data.plate?.veg)? Math.round(data.plate.veg):0,
        protein: Number.isFinite(data.plate?.protein)? Math.round(data.plate.protein):0,
        carbs: Number.isFinite(data.plate?.carbs)? Math.round(data.plate.carbs):0,
      };
      rec.foodType = FOOD_TYPES.some(x=>x.id===data.foodType) ? data.foodType : 'otro';
      rec.mainIngredientDetail = String(data.mainIngredientDetail||'').trim();
      rec.weight = data.weight==='ligero' ? 'ligero' : 'contundente';

/* ---- "Compartir · PDF": generador de PDF real, escrito desde cero ----
   No usa librerías externas (no se pueden cargar en un Artifact) ni
   window.print()/window.open() (no funcionan en este entorno). Construye
   los bytes de un PDF válido a mano (fuente Helvetica + WinAnsiEncoding,
   con justificación por espaciado de palabras) y lo descarga como archivo
   real mediante un Blob y un <a download>. */
const PDF_HELV_WIDTHS = {
  ' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,
  '0':556,'1':556,'2':556,'3':556,'4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,'>':584,'?':556,'@':1015,
  'A':667,'B':667,'C':722,'D':722,'E':667,'F':611,'G':778,'H':722,'I':278,'J':500,'K':667,'L':556,'M':833,'N':722,'O':778,'P':667,'Q':778,'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,
  '[':278,'\\':278,']':278,'^':469,'_':556,'`':333,
  'a':556,'b':556,'c':500,'d':556,'e':556,'f':278,'g':556,'h':556,'i':222,'j':222,'k':500,'l':222,'m':833,'n':556,'o':556,'p':556,'q':556,'r':333,'s':500,'t':278,'u':556,'v':500,'w':722,'x':500,'y':500,'z':500,
  '{':334,'|':260,'}':334,'~':584,
  'á':556,'é':556,'í':222,'ó':556,'ú':556,'ñ':556,'Á':667,'É':667,'Í':278,'Ó':778,'Ú':722,'Ñ':722,'ü':556,'Ü':722,'¿':556,'¡':333,
};
function pdfCharWidth(ch){ return (PDF_HELV_WIDTHS[ch]||556); }
function pdfTextWidth(str, size){
  let w=0; for(const ch of str) w += pdfCharWidth(ch);
  return w/1000*size;
}
function pdfEscape(s){
  return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
// Convierte a Latin-1/WinAnsi (un byte por carácter). Los caracteres fuera
// de ese rango (no deberían aparecer en nuestras recetas en español) caen
// a '?' en vez de romper la generación.
function pdfToWinAnsi(s){
  let out = '';
  for(const ch of s){
    const code = ch.codePointAt(0);
    out += String.fromCharCode(code < 256 ? code : 63);
  }
  return out;
}
function pdfWrapParagraph(text, size, maxWidth){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = [], curWidth = 0;
  const spaceW = pdfTextWidth(' ', size);
  for(const w of words){
    const ww = pdfTextWidth(w, size);
    const addWidth = cur.length ? spaceW + ww : ww;
    if(cur.length && curWidth + addWidth > maxWidth){
      lines.push(cur); cur = [w]; curWidth = ww;
    } else { cur.push(w); curWidth += addWidth; }
  }
  if(cur.length) lines.push(cur);
  return lines.map((words,i)=>({ words, isLast: i===lines.length-1 }));
}
class PDFDoc {
  constructor(){
    this.objects = [];
    this.pageW = 595.28; this.pageH = 841.89; // A4 en puntos
    this.margin = 56;
    this.font = 'F1';
    this.curContent = [];
    this.pageContentNums = [];
    this.y = this.pageH - this.margin;
    this._nextNum = 0;
  }
  _alloc(){ this._nextNum += 1; return this._nextNum; }
  _flushContent(){
    const num = this._alloc();
    const stream = this.curContent.join('\n');
    this.objects.push({num, isStream:true, dict:`<< /Length ${stream.length} >>`, stream});
    return num;
  }
  ensureSpace(lineHeight){
    if(this.y - lineHeight < this.margin){
      this.pageContentNums.push(this._flushContent());
      this.curContent = [];
      this.y = this.pageH - this.margin;
    }
  }
  drawLine(text, size, opts){
    opts = opts || {};
    this.ensureSpace(opts.lineHeight || size*1.35);
    const x = this.margin;
    const esc2 = pdfEscape(pdfToWinAnsi(text));
    let ops = 'BT\n';
    ops += `/${this.font} ${size} Tf\n`;
    if(opts.tw != null) ops += `${opts.tw.toFixed(3)} Tw\n`;
    ops += `${x} ${this.y.toFixed(2)} Td\n`;
    ops += `(${esc2}) Tj\nET`;
    this.curContent.push(ops);
    this.y -= (opts.lineHeight || size*1.35);
  }
  spacer(h){ this.ensureSpace(h); this.y -= h; }
  heading(text, size){
    this.ensureSpace(size*1.6);
    this.drawLine(text, size, {lineHeight:size*1.5});
  }
  paragraph(text, size, opts){
    opts = opts || {};
    const maxWidth = this.pageW - this.margin*2;
    const lineHeight = size*1.45;
    const lines = pdfWrapParagraph(text, size, maxWidth);
    for(const line of lines){
      const words = line.words;
      const raw = words.join(' ');
      let tw = null;
      if(opts.justify && !line.isLast && words.length > 1){
        const naturalWidth = pdfTextWidth(raw, size);
        const deficit = maxWidth - naturalWidth;
        const spaceCount = words.length - 1;
        tw = deficit / spaceCount;
      }
      this.drawLine(raw, size, {lineHeight, tw});
    }
  }
  finish(){
    if(this.curContent.length || this.pageContentNums.length === 0){
      this.pageContentNums.push(this._flushContent());
    }
    const fontNum = this._alloc();
    this.objects.push({num: fontNum, dict: `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`});
    const pageNums = [];
    for(const contentNum of this.pageContentNums){
      const pnum = this._alloc();
      pageNums.push(pnum);
      this.objects.push({num: pnum, dict:
        `<< /Type /Page /Parent PAGES_REF /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /${this.font} ${fontNum} 0 R >> >> /Contents ${contentNum} 0 R >>`
      });
    }
    const pagesNum = this._alloc();
    this.objects.forEach(o=>{ if(typeof o.dict==='string') o.dict = o.dict.replace('PAGES_REF', pagesNum+' 0 R'); });
    this.objects.push({num: pagesNum, dict: `<< /Type /Pages /Kids [${pageNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageNums.length} >>`});
    const catalogNum = this._alloc();
    this.objects.push({num: catalogNum, dict: `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`});
    this.objects.sort((a,b)=>a.num-b.num);
    let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offsets = {};
    for(const o of this.objects){
      offsets[o.num] = out.length;
      if(o.isStream){
        out += `${o.num} 0 obj\n${o.dict}\nstream\n${o.stream}\nendstream\nendobj\n`;
      } else {
        out += `${o.num} 0 obj\n${o.dict}\nendobj\n`;
      }
    }
    const xrefStart = out.length;
    const maxNum = this._nextNum;
    out += `xref\n0 ${maxNum+1}\n`;
    out += `0000000000 65535 f \n`;
    for(let i=1;i<=maxNum;i++){
      const off = offsets[i];
      out += off==null ? `0000000000 00000 f \n` : `${String(off).padStart(10,'0')} 00000 n \n`;
    }
    out += `trailer\n<< /Size ${maxNum+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
    return out; // string binaria Latin-1 — cada código de carácter < 256
  }
}
function pdfStringToBlob(binStr){
  const bytes = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i) & 0xFF;
  return new Blob([bytes], {type:'application/pdf'});
}
let _downloadsCapPromise = null;
function getDownloadsCap(){
  if(!_downloadsCapPromise){
    _downloadsCapPromise = (async()=>{
      try{
        if(window.claude && typeof window.claude.use === 'function'){
          return await window.claude.use('downloads');
        }
      }catch(e){ console.warn('downloads capability error', e); }
      return null;
    })();
  }
  return _downloadsCapPromise;
}
// Ofrece un archivo (blob) al usuario para guardarlo. Usa la capacidad
// "downloads" de Claude (la única vía que realmente funciona dentro del
// visor de artefactos); si no está disponible, recurre al truco clásico
// de enlace <a download> por si la página se abre fuera del visor.
async function offerBlobDownload(blob, filename){
  const downloads = await getDownloadsCap();
  if(downloads){
    const res = await downloads.save({filename, data: blob});
    return res && res.status === 'delivered' ? 'delivered' : 'saved';
  }
  // Fallback (no funciona dentro del visor de artefactos, pero no estorba)
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
  return 'saved';
}

const WITTY_FALLBACKS = [
  'Ni tan sano que aburra, ni tan calórico que dé miedo: el equilibrio de toda la vida.',
  'Esta receta no cura nada, pero al menos no complica las cosas.',
  'Verduras con dignidad y una pizca de sentido común: nada más, nada menos.',
  'No promete milagros, promete que vas a repetir plato.',
  'Un clásico de toda la vida, sin necesidad de reinventarlo con superalimentos de moda.',
  'Si esto no te anima a comer verdura, poco más se puede hacer.',
  'Receta con pocos ingredientes y ninguna excusa para no intentarlo.',
  'Nutritiva, sencilla y sin ínfulas: como debería ser la comida de cada día.',
  'Aquí no hay trucos de restaurante con estrella, solo buena cocina de siempre.',
  'Ideal para esos días en los que la nevera pide poco esfuerzo y buen resultado.',
];
function hashStr(s){
  let h = 0;
  s = String(s||'');
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function fallbackWittyIntro(rec){
  const key = rec.id || rec.name || 'receta';
  return WITTY_FALLBACKS[hashStr(key) % WITTY_FALLBACKS.length];
}
const wittyIntroCache = {}; // id/nombre -> frase, para no repetir la llamada a la IA en la misma sesión
async function getWittyIntro(rec){
  const key = rec.id || rec.name || '';
  if(key && wittyIntroCache[key]) return wittyIntroCache[key];
  if(state.sample){
    try{
      const ingNames = (rec.ingredients||[]).map(i=>i.name).filter(Boolean).slice(0,6).join(', ');
      const prompt = `Eres un chef y nutricionista con un sentido del humor seco y simpático, nunca ofensivo ni grosero. Escribe UNA frase breve (máximo 2 frases cortas) a modo de introducción desenfadada para la receta "${rec.name||'este plato'}", que lleva estos ingredientes principales: ${ingNames||'ingredientes variados'}. Un toque de ironía o humor ácido está bien, pero nunca cruel ni subido de tono.

Devuelve SOLO un objeto JSON, sin texto adicional ni explicación, con este formato exacto: {"intro": string}`;
      const data = await state.sample.json(prompt, {modelTier:'default'});
      const intro = String(data?.intro||'').trim();
      if(intro){ if(key) wittyIntroCache[key] = intro; return intro; }
    }catch(e){ console.warn('witty intro error', e); }
  }
  const fallback = fallbackWittyIntro(rec);
  if(key) wittyIntroCache[key] = fallback;
  return fallback;
}
async function shareRecipeAsPDF(rec){
  const btn = $('#shareRecipeBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Preparando…'; }
  try{
    const intro = await getWittyIntro(rec);
    const doc = new PDFDoc();
    doc.heading(rec.name || 'Receta', 20);
    const metaBits = [
      rec.timeMinutes ? `${rec.timeMinutes} min` : '',
      rec.servings ? `${rec.servings} raciones` : '',
    ].filter(Boolean).join(' · ');
    if(metaBits){ doc.paragraph(metaBits, 10.5, {justify:false}); }
    doc.spacer(6);
    doc.paragraph(intro || '', 11, {justify:true});
    doc.spacer(14);
    doc.heading('Ingredientes', 13);
    doc.spacer(4);
    const ings = (rec.ingredients||[]).filter(i=>i.name);
    if(ings.length){
      for(const i of ings){
        const line = ['-', i.amount, i.unit, i.name].filter(Boolean).join(' ');
        doc.paragraph(line, 11, {justify:false});
      }
    } else {
      doc.paragraph('- (sin ingredientes indicados)', 11, {justify:false});
    }
    doc.spacer(14);
    doc.heading('Pasos', 13);
    doc.spacer(4);
    const steps = (rec.steps||[]).filter(Boolean);
    if(steps.length){
      steps.forEach((s,i)=>{ doc.paragraph((i+1)+'. '+s, 11, {justify:true}); doc.spacer(3); });
    } else {
      doc.paragraph('(sin pasos indicados)', 11, {justify:false});
    }
    const blob = pdfStringToBlob(doc.finish());
    const filename = (rec.name||'receta').replace(/[^\w\-]+/g,'_') + '.pdf';
    const outcome = await offerBlobDownload(blob, filename);
    toast(outcome === 'delivered' ? 'PDF enviado' : 'Receta descargada en PDF');
  }catch(e){
    console.warn('share pdf error', e);
    const code = e && e.code;
    if(code === 'declined'){
      // El usuario ha cancelado el guardado: no es un error, no mostramos nada.
    } else if(code === 'rate_limited'){
      toast('Espera un momento e inténtalo de nuevo');
    } else if(code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed'){
      toast('Descargar el PDF no está disponible en esta vista');
    } else {
      toast('No se ha podido generar el PDF de la receta');
    }
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = `${SHARE_ICON} Compartir`; }
  }
}

        </div>

        <div id="fishTypeWrap" style="${rec.foodType==='pescado'?'':'display:none'}">
          <label class="field-label">Tipo de pescado</label>
          <div class="segmented">
            <button type="button" data-fishtype="blanco" class="${rec.fishType==='blanco'?'active':''}">Blanco</button>
            <button type="button" data-fishtype="azul" class="${rec.fishType==='azul'?'active':''}">Azul</button>
          </div>
        </div>

        <div class="card" style="background:var(--surface-2);border:none">
          <div class="row between" style="margin-bottom:8px">
            <label class="field-label" style="margin:0">Reparto del plato (método de Harvard)</label>
            ${plateDot(rec.plate, 30)}
          </div>
          <p class="hint" style="margin-top:-4px;margin-bottom:8px">Sólo tiene sentido rellenarlo cuando el plato es principal: calcula, a ojo, qué porcentaje ocupan las verduras y frutas, las proteínas y los hidratos.</p>
          <div class="row" style="gap:8px">
            <div style="flex:1"><span class="hint">Verduras/frutas %</span><input type="number" id="fVeg" value="${rec.plate.veg||0}" min="0" max="100"></div>
            <div style="flex:1"><span class="hint">Proteínas %</span><input type="number" id="fProtein" value="${rec.plate.protein||0}" min="0" max="100"></div>
            <div style="flex:1"><span class="hint">Hidratos %</span><input type="number" id="fCarb" value="${rec.plate.carbs||0}" min="0" max="100"></div>
          </div>
          <p class="hint" id="plateSum" style="margin-top:6px">Suma actual: ${total}%${rec.role!=='plato_principal'?' (este plato no es principal, así que no afecta a la planificación)':''}</p>
        </div>
      </div>
    </div>

    <div class="row" style="gap:10px;margin-top:16px">
      ${existingId? `<button class="btn btn-danger" id="deleteRecipeBtn">Eliminar</button>`:''}
      <button class="btn btn-primary btn-block" id="saveRecipeBtn">Guardar receta</button>
    </div>
  `;
}

function readRecipeForm(rec){
  rec.name = $('#fName').value.trim() || 'Sin nombre';
  rec.timeMinutes = $('#fTime').value ? parseInt($('#fTime').value,10) : null;
  rec.servings = $('#fServings').value ? parseInt($('#fServings').value,10) : 4;
  rec.ingredients = $all('[data-ingrow]').map(row=>({
    amount: $('[data-ing="amount"]', row).value.trim(),
    unit: $('[data-ing="unit"]', row).value.trim(),
    name: $('[data-ing="name"]', row).value.trim(),
  })).filter(i=>i.name);
  rec.steps = $all('[data-steprow]').map(row=> $('[data-step]', row).value.trim() ).filter(Boolean);
  rec.temp = $('#fTemp').value;
  rec.season = $('#fSeason').value;
  rec.role = $('#fRole').value;
  const foodTypeBtn = $('.chip.on[data-foodtype]');
  rec.foodType = foodTypeBtn ? foodTypeBtn.dataset.foodtype : guessFoodType(rec);
  rec.mainIngredientDetail = $('#fMainIngredient').value.trim();
  const cookStyleBtn = $('.chip.on[data-cookstyle]');
  rec.cookStyle = cookStyleBtn ? cookStyleBtn.dataset.cookstyle : guessCookStyle(rec);
  const weightBtn = $('[data-weight].active');
  rec.weight = weightBtn ? weightBtn.dataset.weight : 'contundente';
  const meatBtn = $('[data-meattype].active');
  rec.meatType = meatBtn ? meatBtn.dataset.meattype : '';
  const fishBtn = $('[data-fishtype].active');
  rec.fishType = fishBtn ? fishBtn.dataset.fishtype : '';
  rec.plate = { veg: parseInt($('#fVeg').value||0,10), protein: parseInt($('#fProtein').value||0,10), carbs: parseInt($('#fCarb').value||0,10) };
  return rec;
}

function wireRecipeForm(rec, existingId, activeTab){
  activeTab = activeTab || 'ingredientes';
  let speaking = false;
  wireSheetBack();

  /* Detección automática del tipo de alimento: mientras el usuario no
     elija él mismo una categoría en esta sesión de edición (rec._foodTypeTouched),
     recalculamos a partir del nombre y de los ingredientes cada vez que cambian. */
  function updateFoodTypeUI(ft){
    $all('[data-foodtype]').forEach(x=> x.classList.toggle('on', x.dataset.foodtype===ft));
    const meatWrap = $('#meatTypeWrap'), fishWrap = $('#fishTypeWrap');
    if(meatWrap) meatWrap.style.display = ft==='carne' ? '' : 'none';
    if(fishWrap) fishWrap.style.display = ft==='pescado' ? '' : 'none';
    const icon = $('#formFoodIcon');
    if(icon) icon.innerHTML = foodIconBadge(ft, 40);
  }
  function recomputeFoodTypeGuess(){
    if(rec._foodTypeTouched) return;
    const nameVal = $('#fName') ? $('#fName').value : rec.name;
    const ingNames = $all('[data-ing="name"]').map(inp=>({name:inp.value}));
    const guessed = guessFoodType({name:nameVal, ingredients:ingNames});
    rec.foodType = guessed;
    updateFoodTypeUI(guessed);
  }
  $('#fName')?.addEventListener('input', recomputeFoodTypeGuess);
  $all('[data-ing="name"]').forEach(inp=> inp.addEventListener('input', recomputeFoodTypeGuess));

  /* Detección automática del estilo de cocción: mismo patrón que el tipo de
     alimento, bloqueada en cuanto el usuario elige un estilo a mano. */
  function updateCookStyleUI(cs){
    $all('[data-cookstyle]').forEach(x=> x.classList.toggle('on', x.dataset.cookstyle===cs));
  }
  function recomputeCookStyleGuess(){
    if(rec._cookStyleTouched) return;
    const nameVal = $('#fName') ? $('#fName').value : rec.name;
    const guessed = guessCookStyle({name:nameVal});
    rec.cookStyle = guessed;
    updateCookStyleUI(guessed);
  }
  $('#fName')?.addEventListener('input', recomputeCookStyleGuess);
  $all('[data-cookstyle]').forEach(b=> b.addEventListener('click', ()=>{
    rec._cookStyleTouched = true;
    rec.cookStyle = b.dataset.cookstyle;
    updateCookStyleUI(b.dataset.cookstyle);
  }));

  $all('[data-formtab]').forEach(b=> b.addEventListener('click', ()=>{
    activeTab = b.dataset.formtab;
    $all('[data-formtab]').forEach(x=> x.classList.toggle('active', x===b));
    $all('[data-tabpanel]').forEach(p=> p.hidden = p.dataset.tabpanel!==activeTab);
  }));

  $('#addIng').addEventListener('click', ()=>{ rec = readRecipeForm(rec); rec.ingredients.push({name:'',amount:'',unit:''}); renderRecipeForm(rec, existingId, activeTab); });
  $('#addStep').addEventListener('click', ()=>{ rec = readRecipeForm(rec); rec.steps.push(''); renderRecipeForm(rec, existingId, activeTab); });
  $all('[data-removeing]').forEach(b=> b.addEventListener('click', ()=>{ rec = readRecipeForm(rec); rec.ingredients.splice(parseInt(b.dataset.removeing,10),1); if(!rec.ingredients.length) rec.ingredients.push({name:'',amount:'',unit:''}); renderRecipeForm(rec, existingId, activeTab); }));
  $all('[data-removestep]').forEach(b=> b.addEventListener('click', ()=>{ rec = readRecipeForm(rec); rec.steps.splice(parseInt(b.dataset.removestep,10),1); if(!rec.steps.length) rec.steps.push(''); renderRecipeForm(rec, existingId, activeTab); }));
  $all('[data-formmeal]').forEach(b=> b.addEventListener('click', ()=>{
    const id=b.dataset.formmeal; const i=rec.mealTypes.indexOf(id);
    if(i>-1) rec.mealTypes.splice(i,1); else rec.mealTypes.push(id);
    b.classList.toggle('on');
  }));
  $all('[data-foodtype]').forEach(b=> b.addEventListener('click', ()=>{
    rec._foodTypeTouched = true;
    rec.foodType = b.dataset.foodtype;
    updateFoodTypeUI(b.dataset.foodtype);
  }));
  $all('[data-weight]').forEach(b=> b.addEventListener('click', ()=>{
    b.parentElement.querySelectorAll('button').forEach(x=> x.classList.remove('active'));
    b.classList.add('active');
  }));
  $all('[data-meattype]').forEach(b=> b.addEventListener('click', ()=>{
    b.parentElement.querySelectorAll('button').forEach(x=> x.classList.remove('active'));
    b.classList.add('active');
  }));
  $all('[data-fishtype]').forEach(b=> b.addEventListener('click', ()=>{
    b.parentElement.querySelectorAll('button').forEach(x=> x.classList.remove('active'));
    b.classList.add('active');
  }));
  ['fVeg','fProtein','fCarb'].forEach(id=> $('#'+id).addEventListener('input', ()=>{
    const v = parseInt($('#fVeg').value||0,10), p = parseInt($('#fProtein').value||0,10), c = parseInt($('#fCarb').value||0,10);
    $('#plateSum').textContent = `Suma actual: ${v+p+c}%`;
  }));

  const ttsBtn = $('#ttsBtn');
  if(ttsBtn && 'speechSynthesis' in window){
    const label = $('#ttsBtnLabel');
    function updateTtsBtn(){
      ttsBtn.classList.toggle('speaking', speaking);
      ttsBtn.innerHTML = (speaking?STOP_ICON:TTS_ICON) + `<span id="ttsBtnLabel">${speaking?'Detener lectura':'Leer en voz alta'}</span>`;
    }
    ttsBtn.addEventListener('click', ()=>{
      if(speaking){
        speechSynthesis.cancel();
        speaking = false;
        updateTtsBtn();
        return;
      }
      const stepsNow = $all('[data-steprow]').map(row=> $('[data-step]', row).value.trim()).filter(Boolean);
      if(!stepsNow.length){ toast('Añade algún paso antes de escucharlo'); return; }
      const text = stepsNow.map((s,i)=>`Paso ${i+1}: ${s}.`).join(' ');
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      utter.onend = ()=>{ speaking = false; updateTtsBtn(); };
      utter.onerror = ()=>{ speaking = false; updateTtsBtn(); };
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
      speaking = true;
      updateTtsBtn();
    });
  }

  const shareBtn = $('#shareRecipeBtn');
  if(shareBtn) shareBtn.addEventListener('click', ()=>{
    const current = readRecipeForm(JSON.parse(JSON.stringify(rec)));
    shareRecipeAsPDF(current);
  });

  const delBtn = $('#deleteRecipeBtn');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    if(!state.db){ toast('Sin conexión a la base de datos'); return; }
    try{ await state.db.doc('recipes/'+existingId).delete(); toast('Receta eliminada'); closeSheet(); }
    catch(e){ toast('No se pudo eliminar'); }
  });
  $('#saveRecipeBtn').addEventListener('click', async ()=>{
    rec = readRecipeForm(rec);
    if(!rec.name){ toast('Ponle un nombre al plato'); return; }
    if(!state.db){ toast('Sin conexión a la base de datos: no se pudo guardar.'); return; }
    if(existingId && rec.source==='claude') rec.adaptedByUser = true;
    delete rec._foodTypeTouched;
    delete rec._cookStyleTouched;
    try{
      if(existingId){
        await state.db.doc('recipes/'+existingId).set({...rec, updatedAt:Date.now()});
      } else {
        await state.db.collection('recipes').add({...rec, createdAt:Date.now(), updatedAt:Date.now()});
      }
      toast('Receta guardada');
      closeSheet();
    }catch(e){ console.warn(e); toast('No se pudo guardar la receta'); }
  });
}

    <div class="stack tight">
      <div>

function openRecipeSearchSheet(){
  if(!state.sample){ toast('El buscador de ideas con IA no está disponible en esta vista.'); return; }
  const draft = {query:'', cuisines:[], mealTypes:[], diets:[]};
  openSheet(recipeSearchSheetHTML(draft), ()=> wireRecipeSearchSheet(draft));
}

function wireRecipeSearchSheet(draft){
  wireSheetBack();
  $all('[data-searchcuisine]').forEach(b=> b.addEventListener('click', ()=>{
    const id=b.dataset.searchcuisine; const i=draft.cuisines.indexOf(id);
    if(i>-1) draft.cuisines.splice(i,1); else draft.cuisines.push(id);
    b.classList.toggle('on');
  }));
  $all('[data-searchmeal]').forEach(b=> b.addEventListener('click', ()=>{
    const id=b.dataset.searchmeal; const i=draft.mealTypes.indexOf(id);
    if(i>-1) draft.mealTypes.splice(i,1); else draft.mealTypes.push(id);
    b.classList.toggle('on');
  }));
  $all('[data-searchdiet]').forEach(b=> b.addEventListener('click', ()=>{
    const id=b.dataset.searchdiet; const i=draft.diets.indexOf(id);
    if(i>-1) draft.diets.splice(i,1); else draft.diets.push(id);
    b.classList.toggle('on');
  }));

  const actionHost = $('#recipeSearchAction');
  const resultsHost = $('#recipeSearchResults');
  function renderAction(thinking){
    actionHost.innerHTML = `
      ${thinking ? `<div class="thinking"><span class="spinner"></span> Pensando ideas de recetas…</div>` : ''}
      <button class="btn btn-primary btn-block" id="doSearchBtn" ${thinking?'disabled':''}>Buscar ideas</button>
    `;
    $('#doSearchBtn').addEventListener('click', doRecipeSearch);
  }
  renderAction(false);

  async function doRecipeSearch(){
    draft.query = $('#searchQuery').value.trim();
    resultsHost.innerHTML = '';
    renderAction(true);
    const cuisineLabels = draft.cuisines.map(id=>(CUISINE_OPTIONS.find(c=>c.id===id)||{}).label).filter(Boolean);
    const mealLabels = draft.mealTypes.map(id=>(MEAL_TYPES.find(m=>m.id===id)||{}).label).filter(Boolean);
    const dietLabels = draft.diets.map(id=>(DIET_OPTIONS.find(d=>d.id===id)||{}).label).filter(Boolean);
    const prompt = `Eres un chef y nutricionista. El usuario busca ideas de recetas a partir de este texto: "${draft.query || 'sin indicar, sorprende con variedad'}".

Si el texto nombra un plato concreto (por ejemplo "gazpacho" o "mazamorra"), céntrate en ese plato: propón su versión clásica y, si tiene sentido, entre 1 y 2 variantes cercanas (una versión regional, una adaptación más ligera, etc.), en vez de forzar 5 ideas sin relación con lo pedido. Si el texto describe más bien un antojo, un ingrediente que aprovechar o un tipo de cocina sin nombrar un plato concreto, propón 5 ideas variadas para una familia.

Ajusta las propuestas también a estos criterios, cuando se hayan indicado:
- Cocina preferida: ${cuisineLabels.length? cuisineLabels.join(', ') : 'cualquiera; procura variar el origen de los platos, incluyendo con naturalidad alguna propuesta de cocina asiática (china, japonesa, tailandesa o india) si encaja bien'}
- Tipo de comida: ${mealLabels.length? mealLabels.join(', ') : 'cualquiera'}
- Necesidades dietéticas: ${dietLabels.length? dietLabels.join(', ') : 'ninguna en concreto'}

Cuando propongas varias ideas sin un plato concreto en mente, procura que sean variadas entre sí: no repitas el mismo ingrediente principal ni el mismo origen en todas. Estas son propuestas basadas en tu propio conocimiento como chef, no resultado de una búsqueda en internet.

Devuelve SOLO un objeto JSON, sin texto adicional ni explicación, con este formato exacto:
{
  "recipes": [
    {
      "name": string,
      "cuisine": string,
      "ingredients": [{"name": string, "amount": string, "unit": string}],
      "steps": [string, ...],
      "timeMinutes": number,
      "servings": number,
      "mealTypes": array con las que correspondan entre "desayuno","almuerzo","comida","cena","merienda",
      "temp": "fria" | "caliente" | "ambas",
      "season": "invierno" | "verano" | "entretiempo" | "todo_el_año",
      "role": "plato_principal" | "guarnicion" | "postre" | "desayuno_item" | "bebida",
      "plate": {"veg": number, "protein": number, "carbs": number},
      "foodType": "carne" | "pescado" | "marisco" | "legumbre" | "proteina_vegetal" | "huevo" | "lacteo" | "cereal" | "verdura" | "fruta" | "otro",
      "mainIngredientDetail": string,
      "weight": "ligero" | "contundente",
      "cookStyle": "estofado" | "ensalada" | "horno" | "plancha" | "guiso" | "pure" | "salteado" | "asado" | "wok" | "sopa" | "crema" | "frito" | "otro"
    }
  ]
}

Reglas: "cuisine" es el origen del plato en una o dos palabras (ej. "Española", "Tailandesa", "Japonesa"). Para "plate", si role es "plato_principal", estima el reparto aproximado en porcentaje según el método del plato de Harvard (mitad verduras y frutas, un cuarto proteínas, un cuarto hidratos), favoreciendo una buena proporción de verduras; si no es plato principal usa 0 en veg, protein y carbs. "foodType" es la categoría del ingrediente protagonista. "mainIngredientDetail" es ese ingrediente concreto en una o dos palabras. "weight" es "contundente" para guisos, platos de cuchara, arroces o carnes copiosas, y "ligero" para ensaladas, cremas, platos fríos o pescados suaves. "cookStyle" es el estilo de cocción predominante (el que mejor encaje; "otro" si no encaja en ninguno). "timeMinutes" es el tiempo total estimado en minutos y "servings" las raciones (4 si no aplica). Los "steps" van en español, uno por elemento, en infinitivo o imperativo, sin numerarlos tú.`;
    try{
      const data = await state.sample.json(prompt, {modelTier:'default'});
      const list = Array.isArray(data.recipes) ? data.recipes : (Array.isArray(data) ? data : []);
      if(!list.length) throw {code:'invalid_json'};
      list.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'es'));
      renderAction(false);
      resultsHost.innerHTML = `<label class="field-label">Propuestas</label><div class="stack" style="gap:4px">${list.map((r,i)=>searchResultRowHTML(r,i)).join('')}</div>`;
      $all('[data-searchresult]', resultsHost).forEach(row=> row.addEventListener('click', ()=>{
        const idx = parseInt(row.dataset.searchresult,10);
        openSearchResultAsRecipe(list[idx]);
      }));
    }catch(e){
      console.warn('recipe search error', e);
      const msgs = {
        not_granted:'No se ha autorizado usar el buscador de ideas en esta vista.',
        rate_limited:'Demasiadas peticiones seguidas, prueba de nuevo en un momento.',
        invalid_json:'No he podido interpretar bien las propuestas. Prueba a describir lo que quieres con otras palabras.',
      };
      toast(msgs[e.code] || 'No se han podido buscar ideas de recetas ahora mismo.');
      renderAction(false);
    }
  }
}

function searchResultRowHTML(r, i){
  const ft = FOOD_TYPES.some(x=>x.id===r.foodType) ? r.foodType : guessFoodType({name:r.name, ingredients:r.ingredients||[]});
  return `
    <button type="button" class="pick-row" data-searchresult="${i}">
      <span class="row" style="gap:10px;flex:1;min-width:0">
        ${foodIconBadge(ft, 30)}
        <span style="min-width:0;overflow:hidden;text-align:left">
          <span style="display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name||'Receta')}</span>
          <span class="hint">${esc(r.cuisine||'')}</span>
        </span>
      </span>
    </button>`;
}

function openSearchResultAsRecipe(data){
  const rec = blankRecipe();
  rec.name = String(data.name||'').trim();
  rec.ingredients = Array.isArray(data.ingredients) && data.ingredients.length ? data.ingredients.map(i=>({name:String(i.name||''), amount:String(i.amount||''), unit:String(i.unit||'')})) : blankRecipe().ingredients;
  rec.steps = Array.isArray(data.steps) && data.steps.length ? data.steps.map(String) : [''];
  rec.timeMinutes = Number.isFinite(data.timeMinutes) ? Math.round(data.timeMinutes) : null;
  rec.servings = Number.isFinite(data.servings) ? Math.round(data.servings) : 4;
  rec.mealTypes = Array.isArray(data.mealTypes) ? data.mealTypes.filter(m=>MEAL_TYPES.some(x=>x.id===m)) : [];
  rec.temp = ['fria','caliente','ambas'].includes(data.temp) ? data.temp : 'ambas';
  rec.season = ['invierno','verano','entretiempo','todo_el_año'].includes(data.season) ? data.season : 'todo_el_año';
  rec.role = ROLES.some(x=>x.id===data.role) ? data.role : 'plato_principal';
  rec.plate = {
    veg: Number.isFinite(data.plate?.veg)? Math.round(data.plate.veg):0,
    protein: Number.isFinite(data.plate?.protein)? Math.round(data.plate.protein):0,
    carbs: Number.isFinite(data.plate?.carbs)? Math.round(data.plate.carbs):0,
  };
  rec.foodType = FOOD_TYPES.some(x=>x.id===data.foodType) ? data.foodType : guessFoodType({name:rec.name, ingredients:rec.ingredients});
  rec.mainIngredientDetail = String(data.mainIngredientDetail||'').trim();
  rec.weight = data.weight==='ligero' ? 'ligero' : 'contundente';
  rec.cookStyle = COOK_STYLES.some(x=>x.id===data.cookStyle) ? data.cookStyle : guessCookStyle(rec);
  rec.source = 'claude';
  rec._foodTypeTouched = true; // ya viene categorizada por la propuesta
  rec._cookStyleTouched = true;
  renderRecipeForm(rec, null);
  toast('Revisa la propuesta, ajústala si quieres y guárdala');
}

/* Selector de "Comidas a planificar": en dos filas fijas (en vez de chips que
   se envuelven) para que cada fila quepa siempre en una sola línea en móvil.
   Fila 1: las dos comidas principales (comida→"Almuerzo" y cena). Fila 2: el

/* Resumen, de sólo lectura, de quién falta en casa en las fechas mostradas
   (reutiliza la misma caché de asistencia que el calendario de Familia).
   Es una vista "de momento": provisional, sin controles de edición aquí. */
function agendaSummaryHTML(dates){
  const missing = dates.some(d => state.attendanceCache[d] === undefined);
  if(missing){
    Promise.all(dates.map(d=>getAttendance(d))).then(()=>{ if(state.tab==='plan') renderMain(); });
    return `<div class="card"><div class="thinking"><span class="spinner"></span> Consultando ausencias de la familia…</div></div>`;
  }
  const rows = [];

    const away = att.away || [];
    if(away.length){
      const names = away.map(a=> esc(a.name||'') + (a.reason ? ` (${esc((AWAY_REASONS.find(r=>r.id===a.reason)||{}).label||a.reason)})` : '')).join(', ');
      rows.push(`<li><strong>${esc(fmtDateHuman(d))}</strong> — ${names}</li>`);

async function computeDinersForRange(dates){
  const result = {};
  for(const d of dates){
    const att = await getAttendance(d);
    const away = (att && att.away) || [];
    result[d] = Math.max(0, state.family.length - away.length);
  }
  return result;
}
